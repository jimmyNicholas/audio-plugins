name: Bloodline Drums

# The Bloodline Drums spike in plugins/bloodline-drums. Kept apart from tests.yml so the Max for Live tests stay fast.
on:
  push:
    paths:
      - "plugins/bloodline-drums/**"
      - "plugins/shared/**"
      - ".github/workflows/bloodline-drums.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: JUCE's Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev \
            mesa-common-dev xvfb

      - name: Configure
        run: cmake -S plugins/bloodline-drums -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: Offline renders
        run: |
          mkdir -p renders
          build/bloodline_render renders 1

      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --validate "build/BloodlineDrums_artefacts/Release/VST3/Bloodline Drums.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: bloodline-drums-renders
          path: renders/*.wav

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # A universal binary, so it runs on the Intel Mac (macOS 13) as well as Apple Silicon.
      - name: Configure
        run: >
          cmake -S plugins/bloodline-drums -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build -j4 --target BloodlineDrums_VST3 BloodlineDrums_AU

      - name: Validate the AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/BloodlineDrums_artefacts/Release/AU/Bloodline Drums.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Bldr Jnic

      # Everything inside one Bloodline-drums folder, so unzipping several downloads never mixes them.
      - name: Zip
        run: |
          mkdir -p "dist/Bloodline-drums"
          cp -R "build/BloodlineDrums_artefacts/Release/VST3/Bloodline Drums.vst3" "dist/Bloodline-drums/"
          cp -R "build/BloodlineDrums_artefacts/Release/AU/Bloodline Drums.component" "dist/Bloodline-drums/"
          cp plugins/bloodline-drums/install-bloodline-drums.sh "dist/Bloodline-drums/"
          cd dist && zip -qry ../Bloodline-drums-mac.zip "Bloodline-drums"

      - uses: actions/upload-artifact@v4
        with:
          name: Bloodline-drums-mac
          path: Bloodline-drums-mac.zip
