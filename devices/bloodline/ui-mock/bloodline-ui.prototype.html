<title>Bloodline Pad Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. Answers issue #38: what is the simplest UI that runs the
  breeding loop for the three rows and mirrors the MPD226's 4x4 pads?

  Three layouts on one page, switched by the floating bar, the arrow keys or the
  hash: #a (hardware mirror), #b (lanes), #c (bare grid with one inspector).
  All three run the same breeding rules from #37 and the same rough WebAudio voice.

  Run: open this file in a browser. With Web MIDI (Chrome) an MPD226 on Bank A
  plays it on notes 36 to 51. Otherwise click the pads.
  No persistence: reload starts over.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout: a dark hardware panel; pads lit by their row's zone colour. Single dark look on purpose. */
:root {
  color-scheme: dark;
  --bg: #17181b;
  --panel: #212226;
  --pad: #2c2d32;
  --pad-edge: #3a3b41;
  --fg: #e8e6e1;
  --muted: #8d8b86;
  --kick: #e4572e;
  --snare: #f2c14e;
  --hats: #6cc3d5;
  --none: #a7a3b8;
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 96px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; max-width: 760px; margin: 0 auto 16px; }
.top h1 { margin: 0; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
.top .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
#stage { max-width: 760px; margin: 0 auto; }

/* Pads, shared by every layout */
.pad {
  --z: var(--none);
  position: relative; aspect-ratio: 1; max-width: 100%;
  background: var(--pad); border: 1px solid var(--pad-edge); border-radius: 6px;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 6px; text-align: left; min-width: 0;
  transition: background 0.12s, box-shadow 0.12s;
}
.pad .note { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.pad .lbl { font-weight: 700; font-size: 18px; letter-spacing: 0.04em; }
.pad .bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; }
.pad .bars i { flex: 1; background: var(--z); opacity: 0.7; border-radius: 1px; min-height: 1px; }
.pad.fav { box-shadow: inset 0 0 0 2px var(--z); }
.pad.fav::after { content: "\2605"; position: absolute; top: 4px; right: 6px; color: var(--z); font-size: 13px; }
.pad.armed .lbl { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.pad.armed::before { content: "last"; position: absolute; bottom: 30px; right: 6px; font-family: var(--mono); font-size: 9px; color: var(--z); text-transform: uppercase; }
.pad.choose { background: color-mix(in srgb, var(--z) 18%, var(--pad)); }
.pad.choose.ready { background: color-mix(in srgb, var(--z) 40%, var(--pad)); }
.pad.empty { opacity: 0.35; }
.pad.silent .bars { opacity: 0.2; }
.pad.lit { background: color-mix(in srgb, var(--z) 70%, var(--pad)); }
.z-kick { --z: var(--kick); } .z-snare { --z: var(--snare); } .z-hats { --z: var(--hats); } .z-none { --z: var(--none); }

.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--pad-edge); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.seg button.on { background: var(--z); color: var(--bg); font-weight: 700; }
.spread { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.spread .meter { width: 72px; height: 6px; background: var(--pad); border-radius: 3px; overflow: hidden; }
.spread .meter b { display: block; height: 100%; background: var(--z); }
.spread .dots { letter-spacing: 1px; color: var(--z); }

/* A: hardware mirror */
.va { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 200px); gap: 8px; align-items: center; }
.va .side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.va .side .name { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
@media (max-width: 560px) {
  .va { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .va .side { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .va .pad .lbl { font-size: 15px; }
}

/* B: lanes */
.vb { display: flex; flex-direction: column; gap: 12px; }
.lane { background: var(--panel); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 110px repeat(3, minmax(0, 1fr)) minmax(0, 1.2fr) 24px minmax(0, 1fr); gap: 8px; align-items: center; border-left: 4px solid var(--z); }
.lane .head { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lane .head .name { font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--z); }
.lane .head select { background: var(--pad); color: var(--fg); border: 1px solid var(--pad-edge); border-radius: 4px; padding: 3px; font: inherit; font-size: 13px; }
.lane .arrow { color: var(--muted); text-align: center; font-size: 18px; }
.lane .pad.choose { aspect-ratio: auto; height: 100%; }
.lane .spreadcell { grid-column: 2 / -1; }
@media (max-width: 560px) {
  .lane { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lane .head { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  .lane .arrow { display: none; }
  .lane .pad.choose { aspect-ratio: 1; }
  .lane .spreadcell { grid-column: 1 / -1; }
}
.vb .foot { color: var(--muted); font-size: 12px; font-family: var(--mono); }

/* C: bare grid + inspector */
.vc { display: flex; flex-direction: column; gap: 16px; }
.vc .grid { display: grid; grid-template-columns: 28px repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 520px; width: 100%; margin: 0 auto; }
.vc .tab { writing-mode: vertical-rl; transform: rotate(180deg); background: var(--pad); border: 1px solid var(--pad-edge); border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 4px 0; }
.vc .tab.sel { background: var(--z); color: var(--bg); font-weight: 700; }
.vc .tab.blank { visibility: hidden; }
.inspector { background: var(--panel); border-radius: 8px; padding: 14px; display: grid; gap: 12px; max-width: 520px; width: 100%; margin: 0 auto; border-top: 3px solid var(--z); }
.inspector h2 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--z); }
.inspector .rowline { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.params { display: grid; grid-template-columns: 70px minmax(0, 1fr) 52px; gap: 6px 10px; align-items: center; font-size: 13px; }
.params .track { height: 6px; background: var(--pad); border-radius: 3px; position: relative; }
.params .track b { position: absolute; top: -3px; width: 4px; height: 12px; background: var(--z); border-radius: 1px; }
.params .track s { position: absolute; top: 0; height: 100%; background: color-mix(in srgb, var(--z) 25%, transparent); }
.lock { background: transparent; border: 1px solid var(--pad-edge); border-radius: 4px; font-size: 11px; padding: 2px 4px; color: var(--muted); }
.lock.on { background: var(--z); color: var(--bg); border-color: var(--z); }

/* State readout and switcher (not part of the design being judged) */
details.state { max-width: 760px; margin: 24px auto 0; color: var(--muted); font-size: 12px; }
details.state pre { font-family: var(--mono); font-size: 11px; white-space: pre-wrap; overflow-x: auto; background: #0e0e10; padding: 10px; border-radius: 6px; }
.switcher {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; background: #fffbe8; color: #111;
  border-radius: 999px; padding: 4px; box-shadow: 0 4px 18px rgba(0,0,0,0.5); font-family: var(--mono); font-size: 13px; z-index: 20; max-width: calc(100% - 32px);
}
.switcher button { background: #111; color: #fffbe8; border: 0; border-radius: 999px; width: 30px; height: 30px; }
.switcher span { padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
</style>

<div class="top">
  <h1>Bloodline</h1>
  <div class="meta" id="midi">MIDI: checking</div>
</div>
<div id="stage"></div>
<details class="state"><summary>State (prototype readout)</summary><pre id="state"></pre></details>
<div class="switcher" role="toolbar" aria-label="Prototype layout">
  <button id="prev" aria-label="Previous layout">&larr;</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Next layout">&rarr;</button>
</div>

<script>
// ---------- breeding (rules from #37) ----------
const PARAMS = ["tune", "decay", "tone", "noise", "punch", "drive"];
const ZONES = {
  kick:  [0.15, 0.45, 0.20, 0.10, 0.60, 0.30],
  snare: [0.50, 0.35, 0.55, 0.60, 0.30, 0.30],
  hats:  [0.85, 0.15, 0.85, 0.90, 0.05, 0.20],
};
const ZONE_NAMES = ["kick", "snare", "hats", null];
const PULL = 0.2, START_STEP = 0.25, NARROW = 0.6, WIDEN = 1.6, MIN_STEP = 0.02, MAX_STEP = 0.5;
const clamp = (x) => Math.min(1, Math.max(0, x));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const fresh = (zone) => PARAMS.map((_, i) => zone ? clamp(ZONES[zone][i] + (Math.random() * 2 - 1) * 0.2) : Math.random());
function breed(row, parent) {
  return PARAMS.map((_, i) => {
    if (row.locks[i]) return parent[i];
    let x = parent[i] + gauss() * row.step;
    if (row.zone) x += (ZONES[row.zone][i] - x) * PULL;
    return clamp(x);
  });
}
function makeRow(zone) {
  return { zone, cands: [fresh(zone), fresh(zone), fresh(zone)], fav: null, last: null, step: START_STEP, count: 0, chosen: null, locks: PARAMS.map(() => false) };
}
// rows[0] is row 1 (top, notes 48-51); rows[2] is row 3 (notes 40-43)
const rows = [makeRow("hats"), makeRow("snare"), makeRow("kick")];

function choose(r) {
  const row = rows[r];
  if (row.last === null) return false;
  const pick = row.last;
  if (row.fav !== null) {
    if (pick === row.fav) { row.step = Math.max(MIN_STEP, row.step * NARROW); row.count = 0; }
    else if (++row.count >= 2) { row.step = Math.min(MAX_STEP, row.step * WIDEN); row.count = 0; }
  }
  row.fav = pick;
  row.chosen = row.cands[pick].slice();
  row.cands = row.cands.map((c, i) => i === pick ? c : breed(row, row.chosen));
  row.last = null;
  return true;
}

// ---------- notes: 36 bottom left, left to right then up ----------
const noteOf = (g, c) => 36 + g * 4 + c;
function describe(n) {
  const g = Math.floor((n - 36) / 4), c = (n - 36) % 4;
  if (g === 0) return c < 3 ? { kind: "bottom", r: 2 - c } : { kind: "empty" };
  return c < 3 ? { kind: "cand", r: 3 - g, c } : { kind: "choose", r: 3 - g };
}
const lit = {};
function handleNote(n, vel) {
  const d = describe(n);
  if (d.kind === "empty") return;
  const row = rows[d.r];
  if (d.kind === "cand") { row.last = d.c; play(n, row.cands[d.c], vel); }
  else if (d.kind === "choose") { if (choose(d.r)) play(n, row.chosen, vel); }
  else if (d.kind === "bottom" && row.chosen) play(n, row.chosen, vel);
  lit[n] = true; render();
  setTimeout(() => { delete lit[n]; render(); }, 110);
}

// ---------- rough voice: one voice per pad, cuts its own tail ----------
let ctx = null; const voices = {};
let noiseBuf = null;
function play(n, p, vel) {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = ctx.currentTime, v = vel / 127;
  if (voices[n]) { voices[n].gain.cancelScheduledValues(t); voices[n].gain.setTargetAtTime(0, t, 0.004); }
  const [tune, decay, tone, noise, punch, drive] = p;
  const out = ctx.createGain(); out.gain.value = 0.7 * v * v;
  const shaper = ctx.createWaveShaper(); const k = 1 + drive * 40 + v * 8;
  const curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(k * x) / Math.tanh(k); }
  shaper.curve = curve; shaper.connect(out); out.connect(ctx.destination);
  const dur = 0.04 + decay * decay * 1.2, f = 35 * Math.pow(2, tune * 4.5);
  const osc = ctx.createOscillator(), og = ctx.createGain();
  osc.frequency.setValueAtTime(f * (1 + punch * 6), t); osc.frequency.exponentialRampToValueAtTime(f, t + 0.02 + punch * 0.06);
  og.gain.setValueAtTime(0.9 * (1 - noise * 0.85), t); og.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(og).connect(shaper); osc.start(t); osc.stop(t + dur + 0.05);
  const src = ctx.createBufferSource(), filt = ctx.createBiquadFilter(), ng = ctx.createGain();
  src.buffer = noiseBuf; filt.type = tune > 0.7 ? "highpass" : "bandpass"; filt.frequency.value = 300 * Math.pow(2, tone * 5.3);
  ng.gain.setValueAtTime(noise * (0.5 + v * 0.3), t); ng.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.7 + 0.01);
  src.connect(filt).connect(ng).connect(shaper); src.start(t); src.stop(t + dur + 0.05);
  voices[n] = out;
}

// ---------- shared pad markup ----------
const zcls = (z) => "z-" + (z || "none");
const zlabel = (z) => z ? z[0].toUpperCase() + z.slice(1) : "None";
const bars = (p) => `<span class="bars">${(p || PARAMS.map(() => 0)).map((x) => `<i style="height:${Math.round(x * 100)}%"></i>`).join("")}</span>`;
function pad(n) {
  const d = describe(n);
  if (d.kind === "empty") return `<button class="pad empty z-none" data-note="${n}" aria-label="Pad ${n}, empty"><span class="note">${n}</span><span class="lbl">&nbsp;</span><span class="bars"></span></button>`;
  const row = rows[d.r], cls = ["pad", zcls(row.zone)];
  if (lit[n]) cls.push("lit");
  let lbl, p;
  if (d.kind === "cand") { lbl = "ABC"[d.c]; p = row.cands[d.c]; if (row.fav === d.c) cls.push("fav"); if (row.last === d.c) cls.push("armed"); }
  else if (d.kind === "choose") { lbl = "Choose"; p = null; cls.push("choose"); if (row.last !== null) cls.push("ready"); }
  else { lbl = `Row ${d.r + 1}`; p = row.chosen; if (!p) cls.push("silent"); }
  return `<button class="${cls.join(" ")}" data-note="${n}" aria-label="Pad ${n}, ${lbl}"><span class="note">${n}</span><span class="lbl">${lbl}</span>${d.kind === "choose" ? `<span class="bars"></span>` : bars(p)}</button>`;
}
function zoneSwitch(r) {
  return `<span class="seg ${zcls(rows[r].zone)}" role="group" aria-label="Row ${r + 1} zone">${ZONE_NAMES.map((z) => `<button class="${rows[r].zone === z ? "on" : ""}" data-zone="${z}" data-row="${r}">${zlabel(z)}</button>`).join("")}</span>`;
}
function spread(r) {
  const row = rows[r];
  const pct = Math.round(100 * Math.log(row.step / MIN_STEP) / Math.log(MAX_STEP / MIN_STEP));
  return `<span class="spread ${zcls(row.zone)}" title="Spread: how far new candidates are bred from the favourite">spread <span class="meter"><b style="width:${pct}%"></b></span>${row.step.toFixed(2)} <span class="dots">${row.count ? "●○" : "○○"}</span></span>`;
}

// ---------- A: hardware mirror ----------
function renderA() {
  let h = `<div class="va">`;
  for (let g = 3; g >= 0; g--) {
    for (let c = 0; c < 4; c++) h += pad(noteOf(g, c));
    if (g > 0) { const r = 3 - g; h += `<div class="side"><span class="name">Row ${r + 1}</span>${zoneSwitch(r)}${spread(r)}</div>`; }
    else h += `<div class="side"><span class="name">Last chosen</span></div>`;
  }
  return h + `</div>`;
}

// ---------- B: lanes (bottom pad folded into the end of each lane) ----------
function renderB() {
  let h = `<div class="vb">`;
  for (let r = 0; r < 3; r++) {
    const g = 3 - r, row = rows[r];
    h += `<div class="lane ${zcls(row.zone)}"><div class="head"><span class="name">${zlabel(row.zone)}</span>
      <select id="zone-b-${r}" data-row="${r}" aria-label="Row ${r + 1} zone">${ZONE_NAMES.map((z) => `<option value="${z}" ${row.zone === z ? "selected" : ""}>${zlabel(z)}</option>`).join("")}</select></div>
      ${pad(noteOf(g, 0))}${pad(noteOf(g, 1))}${pad(noteOf(g, 2))}${pad(noteOf(g, 3))}<span class="arrow">&rarr;</span>${pad(noteOf(0, 2 - r))}
      <div class="spreadcell">${spread(r)}</div></div>`;
  }
  return h + `<div class="foot">Pad 39 is empty and not shown.</div></div>`;
}

// ---------- C: bare grid, one inspector for the selected row, with locks ----------
let selRow = 2;
function renderC() {
  let h = `<div class="vc"><div class="grid">`;
  for (let g = 3; g >= 0; g--) {
    const r = 3 - g;
    h += g > 0 ? `<button class="tab ${zcls(rows[r].zone)} ${selRow === r ? "sel" : ""}" data-sel="${r}">Row ${r + 1}</button>` : `<span class="tab blank"></span>`;
    for (let c = 0; c < 4; c++) h += pad(noteOf(g, c));
  }
  const row = rows[selRow], ref = row.chosen || row.cands[0];
  h += `</div><div class="inspector ${zcls(row.zone)}"><h2>Row ${selRow + 1}: ${zlabel(row.zone)}</h2>
    <div class="rowline">${zoneSwitch(selRow)}${spread(selRow)}</div>
    <div class="params">${PARAMS.map((name, i) => {
      const lo = clamp(ref[i] - row.step), hi = clamp(ref[i] + row.step);
      return `<span>${name}</span><span class="track"><s style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></s><b style="left:calc(${ref[i] * 100}% - 2px)"></b></span>
        <button class="lock ${row.locks[i] ? "on" : ""}" data-lock="${i}">${row.locks[i] ? "locked" : "lock"}</button>`;
    }).join("")}</div>
    <span class="spread">${row.chosen ? "Marks show the favourite; shading shows the spread." : "Showing pad A until the first choice."}</span></div></div>`;
  return h;
}

// ---------- switcher ----------
const VARIANTS = [["a", "A: Hardware mirror", renderA], ["b", "B: Lanes", renderB], ["c", "C: Bare grid + inspector", renderC]];
function current() {
  const h = location.hash.slice(1).toLowerCase(), q = new URLSearchParams(location.search).get("variant");
  const key = VARIANTS.some((v) => v[0] === h) ? h : (q || "a").toLowerCase();
  return Math.max(0, VARIANTS.findIndex((v) => v[0] === key));
}
function go(d) { const i = (current() + d + VARIANTS.length) % VARIANTS.length; location.hash = VARIANTS[i][0]; }

function render() {
  const v = VARIANTS[current()];
  document.getElementById("stage").innerHTML = v[2]();
  document.getElementById("vlabel").textContent = v[1];
  document.getElementById("state").textContent = JSON.stringify(rows.map((row, r) => ({
    row: r + 1, zone: row.zone, favourite: row.fav === null ? null : "ABC"[row.fav], lastPressed: row.last === null ? null : "ABC"[row.last],
    step: +row.step.toFixed(3), count: row.count, locks: PARAMS.filter((_, i) => row.locks[i]),
    chosen: row.chosen && row.chosen.map((x) => +x.toFixed(2)),
  })), null, 1);
}

document.getElementById("stage").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-note]");
  if (b) { e.preventDefault(); handleNote(+b.dataset.note, 100); }
});
document.getElementById("stage").addEventListener("keydown", (e) => {
  const b = e.target.closest("[data-note]");
  if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); handleNote(+b.dataset.note, 100); }
});
document.getElementById("stage").addEventListener("click", (e) => {
  const z = e.target.closest("[data-zone]"), s = e.target.closest("[data-sel]"), l = e.target.closest("[data-lock]");
  if (z) { const v = z.dataset.zone; rows[+z.dataset.row].zone = v === "null" ? null : v; render(); }
  if (s) { selRow = +s.dataset.sel; render(); }
  if (l) { const row = rows[selRow], i = +l.dataset.lock; row.locks[i] = !row.locks[i]; render(); }
});
document.getElementById("stage").addEventListener("change", (e) => {
  if (e.target.matches("select[data-row]")) { const v = e.target.value; rows[+e.target.dataset.row].zone = v === "null" ? null : v; render(); }
});
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
window.addEventListener("hashchange", render);

// ---------- MPD226 over Web MIDI, Bank A notes 36 to 51 ----------
const midiLabel = document.getElementById("midi");
try {
  if (!navigator.requestMIDIAccess) throw new Error();
  navigator.requestMIDIAccess().then((access) => {
    const hook = () => { let n = 0; access.inputs.forEach((inp) => { n++; inp.onmidimessage = (m) => {
      const [st, note, vel] = m.data;
      if ((st & 0xf0) === 0x90 && vel > 0 && note >= 36 && note <= 51) handleNote(note, vel);
    }; }); midiLabel.textContent = n ? `MIDI: ${n} input${n > 1 ? "s" : ""}, notes 36 to 51` : "MIDI: no inputs, click the pads"; };
    hook(); access.onstatechange = hook;
  }, () => { midiLabel.textContent = "MIDI: not allowed here, click the pads"; });
} catch { midiLabel.textContent = "MIDI: not available here, click the pads"; }

render();
</script>
