<title>Bloodline Breaks Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* PROTOTYPE, throwaway, UI only. Mobile first: three tabs (Drums, Groove, Break) under a sticky transport, a tab bar at the bottom; from 1000px the three panels sit side by side and the tab bar goes. One dark look, colours from the Bloodline Breaks 2 editor. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1f2229; --tile: #292d36; --edge: #3a3f4b; --fg: #e8e6e1; --muted: #8d8f96; --faint: #5d626d;
  --accent: #ff8c69; --parent: #ffc857; --keep: #9be564; --lock: #b39ddb; --groove: #f2c14e; --wild: #c9c6bf;
  --kick: #ff6b6b; --snare: #7cc6fe; --hat: #f4d35e; --perc: #9be564;
  --g1: #7cc6fe; --g2: #ff8c69; --g3: #9be564; --g4: #d59bf6; --g5: #f4d35e;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tabh: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font: 14px/1.4 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* transport */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--edge); }
.top-in { display: flex; align-items: center; gap: 8px; padding-block: 8px; max-width: 1500px; margin: 0 auto; }
.brand { font: 700 15px var(--body); letter-spacing: 0.04em; margin-right: auto; white-space: nowrap; }
.brand small { display: block; font: 10px var(--mono); color: var(--muted); letter-spacing: 0; font-weight: 400; }
.playbtn { height: 40px; min-width: 92px; border-radius: 20px; border: 1.5px solid var(--edge); background: var(--tile); font-weight: 700; }
.playbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.bpm { font: 500 12px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.bpm b { display: block; color: var(--fg); font-size: 15px; }
@media (max-width: 440px) { .brand { font-size: 13px; } .brand small { display: none; } .playbtn { min-width: 72px; } .midi { padding: 0 8px; } }
.midi { height: 40px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--tile); padding: 0 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }

/* layout */
main { max-width: 1500px; margin: 0 auto; padding-block: 12px calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 20px); }
.panes { display: grid; gap: 14px; }
.pane { display: grid; gap: 12px; min-width: 0; align-content: start; }
.pane[data-pane]:not(.on) { display: none; }
@media (min-width: 1000px) {
  .panes { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .pane[data-pane]:not(.on) { display: grid; }
  .tabs { display: none !important; }
  main { padding-bottom: 32px; }
  .pane { background: color-mix(in srgb, var(--panel) 45%, var(--bg)); border-radius: 14px; padding: 12px; }
}
.pane-head { display: flex; align-items: baseline; gap: 8px; }
.pane-head h2 { margin: 0; font: 700 20px var(--body); }
.pane-head .n { font: 600 12px var(--mono); color: var(--faint); }
.pane-head p { margin: 0; font-size: 12px; color: var(--muted); }
.lab { font: 700 10px var(--body); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 17px; border: 1px solid var(--edge); background: var(--tile); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--on, var(--accent)); border-color: var(--on, var(--accent)); color: var(--bg); font-weight: 700; }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--tile); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.small { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.hot { border-color: var(--groove); color: var(--groove); font-weight: 700; }
.sl { display: grid; grid-template-columns: 74px minmax(0, 1fr) 54px; align-items: center; gap: 10px; }
.sl.lockable { grid-template-columns: 74px minmax(0, 1fr) 54px 58px; }
.sl > span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl output { font: 12px var(--mono); text-align: right; white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; background: none; height: 30px; width: 100%; min-width: 0; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sc, var(--accent)) var(--p, 50%), var(--tile) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sc, var(--accent)) var(--p, 50%), var(--tile) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--sc, var(--accent)); margin-top: -7px; border: 3px solid var(--bg); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--sc, var(--accent)); border: 3px solid var(--bg); }
.lock { height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--tile); font-size: 11px; font-weight: 600; }
.lock[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: var(--bg); }
.card { background: var(--panel); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.hint.warm { color: var(--parent); }

/* litters */
.litter { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--tile); border: 1px solid var(--edge); border-radius: 10px; padding: 8px; display: grid; gap: 6px; min-width: 0; text-align: left; }
.tile.hear { border: 2px solid var(--ta, var(--accent)); padding: 7px; background: color-mix(in srgb, var(--tile) 82%, var(--ta, var(--accent))); }
.tile .th { display: flex; align-items: baseline; gap: 6px; }
.tile .th b { font: 700 18px var(--body); }
.tile .th em { margin-left: auto; font: 700 11px var(--body); font-style: normal; color: var(--ta, var(--accent)); }
.tile .th em.par { color: var(--parent); }
.tile svg { display: block; width: 100%; height: 64px; }
.tile .meta { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile .acts .btn { height: 32px; padding: 0 4px; }
.hearzone { display: grid; gap: 6px; background: none; border: 0; padding: 0; text-align: left; }

/* settings accordion */
details.grp { border-top: 1px solid var(--edge); }
details.grp summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; font: 700 12px var(--body); letter-spacing: 0.08em; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
details.grp summary small { margin-left: auto; font: 11px var(--mono); color: var(--muted); letter-spacing: 0; font-weight: 400; }
details.grp summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 16px; }
details.grp[open] summary::after { content: "−"; }
details.grp .sets { display: grid; gap: 2px; padding-bottom: 10px; }

/* keep */
.keep { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pad { position: relative; min-height: 70px; border-radius: 8px; border: 1px solid var(--edge); background: var(--panel); padding: 5px 6px; display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
.pad.full { background: var(--tile); border-color: color-mix(in srgb, var(--kc) 70%, transparent); }
.pad.target { border: 1.5px dashed var(--keep); background: color-mix(in srgb, var(--panel) 85%, var(--keep)); }
.pad .no { font: 10px var(--mono); color: var(--muted); }
.pad .nm { font: 700 12px var(--body); color: var(--kc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .dr { margin: auto; font-size: 11px; color: var(--muted); text-align: center; }
.pad .x { position: absolute; top: 2px; right: 3px; width: 22px; height: 22px; border: 0; background: none; color: var(--muted); font-size: 14px; }
.pad svg { display: block; width: 100%; height: 22px; margin-top: auto; }
.pad .used { position: absolute; bottom: 4px; right: 5px; font: 700 10px var(--mono); color: var(--bg); background: var(--kc); border-radius: 3px; padding: 0 4px; }

/* groove */
.gdesc { font-size: 12px; color: var(--muted); margin: -4px 0 4px; }
.feelrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.feelrow .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--kc); color: var(--bg); font: 700 11px var(--mono); display: flex; align-items: center; justify-content: center; }
.feelrow .who { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 12px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--groove); color: var(--bg); font-weight: 700; }
.seedpill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid var(--groove); background: var(--tile); font-weight: 700; font-size: 13px; color: var(--groove); }
.seedpill svg { width: 44px; height: 16px; }

/* break */
.plays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { position: relative; height: 54px; border-radius: 8px; border: 1.5px solid var(--kc, var(--edge)); background: var(--tile); padding: 4px 6px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.slot .no { font: 700 10px var(--mono); color: var(--kc); }
.slot .nm { font: 700 12px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .to { font: 10px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.empty { border-style: dashed; color: var(--muted); }
.gridbox { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px; }
.rowheads { display: grid; grid-template-rows: 16px repeat(4, 1fr); gap: 3px; }
.rh { display: flex; align-items: center; gap: 4px; min-width: 0; }
.rh .tag { width: 18px; height: 18px; border-radius: 4px; background: var(--kc); color: var(--bg); font: 700 10px var(--mono); display: flex; align-items: center; justify-content: center; flex: none; }
.rh .nm { font-size: 10.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.rh .lk { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--edge); background: var(--tile); font: 700 9px var(--body); padding: 0; flex: none; }
.rh .lk[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: var(--bg); }
.steps { display: grid; grid-template-rows: 16px repeat(4, 1fr); gap: 3px; position: relative; }
.counts, .lane { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; }
.counts span { font: 9px var(--mono); color: var(--muted); text-align: center; }
.counts span.beat { color: var(--fg); }
.lane { height: 38px; border-radius: 4px; }
.lane.locked { background: color-mix(in srgb, transparent 84%, var(--lock)); }
.cell { position: relative; border: 0; padding: 0; border-radius: 3px; background: rgba(58,63,75,0.28); min-width: 0; }
.cell.beat { background: rgba(58,63,75,0.55); }
.cell i { position: absolute; left: 15%; right: 15%; bottom: 2px; border-radius: 2px; background: var(--kc); opacity: var(--o, 1); }
.playhead { position: absolute; top: 16px; bottom: 0; width: 2px; background: var(--fg); opacity: 0.75; pointer-events: none; left: 0; }
.map { font: 10.5px var(--mono); color: var(--muted); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--edge); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabh); max-width: 600px; margin: 0 auto; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.tab i { width: 26px; height: 4px; border-radius: 2px; background: var(--edge); }
.tab small { font: 10px var(--mono); font-weight: 400; }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"] i { background: var(--tc); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
@media (min-width: 1000px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.sheet h3 { margin: 0; font-size: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); background: var(--tile); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }
@media (min-width: 1000px) { .toast { bottom: 20px; } }
</style>

<script>
/* PROTOTYPE, wipe me. A mobile-first look at Bloodline Breaks 2 with the user's changes, UI only:
   - Drums: Breaks 2's left panel (zone, loop audition, four drum tiles, 19 settings, eight keep pads).
   - Groove: a new panel that seeds the break. Like every Bloodline panel: four options (A to D, Breed,
     Cross, Back, New), the heard option's settings (Groove, Complexity, Forward, Behind, with locks,
     plus a feel per row), and choices (kept grooves). The heard groove is the seed.
   - Break: Breaks 2's right panel without layering. Four chosen pads, left to right, play the grid's
     rows from the bottom up: pad 1 is the bottom row, pad 4 the top.
   Nothing makes sound; Breed and the rest redraw example data so the screens can be judged. */
(function () {
'use strict';
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = 'ABCD';
const ZCOL = { Kick: 'var(--kick)', Snare: 'var(--snare)', Hats: 'var(--hat)', Perc: 'var(--perc)', None: 'var(--wild)' };
const GC = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)', 'var(--g5)'];
const SET = [ // Bloodline Drums' 19 settings: name, group, unit, min, max, log
  ['Pitch', 0, 'Hz', 20, 2000, 1], ['Sweep', 0, 'st', 0, 60], ['Sweep time', 0, 's', 0.002, 0.3, 1], ['Attack', 0, 's', 0, 0.05], ['Decay', 0, 's', 0.005, 4, 1],
  ['Body / Noise', 1, '%', 0, 1], ['Noise tone', 1, 'Hz', 100, 16000, 1], ['Noise decay', 1, 's', 0.005, 4, 1], ['Metal', 1, '%', 0, 1],
  ['Click', 2, '%', 0, 1], ['Click tone', 2, 'Hz', 500, 12000, 1],
  ['Drive', 3, '%', 0, 1], ['Bits', 3, 'bits', 16, 2], ['Rate', 3, 'Hz', 48000, 1000, 1],
  ['High-pass', 4, 'Hz', 20, 8000, 1], ['Low-pass', 4, 'Hz', 200, 20000, 1], ['Resonance', 4, '%', 0, 0.95], ['Pan', 4, 'pan', -1, 1], ['Level', 4, 'dB', -24, 0],
];
const GROUPS = ['Body', 'Noise', 'Click', 'Grit', 'Out'];
function real(i, n) { const s = SET[i]; return s[5] ? s[3] * Math.pow(s[4] / s[3], n) : s[3] + (s[4] - s[3]) * n; }
function fmt(i, n) {
  const v = real(i, n), u = SET[i][2];
  if (u === 'Hz') return v >= 1000 ? (v / 1000).toFixed(1) + ' kHz' : Math.round(v) + ' Hz';
  if (u === 's') return v < 1 ? (v * 1000).toFixed(v < 0.01 ? 1 : 0) + ' ms' : v.toFixed(2) + ' s';
  if (u === 'st') return v.toFixed(1) + ' st';
  if (u === 'bits') return v.toFixed(1) + ' bits';
  if (u === 'dB') return v.toFixed(1) + ' dB';
  if (u === 'pan') return Math.abs(v) < 0.02 ? 'C' : (v < 0 ? 'L' : 'R') + Math.round(Math.abs(v) * 100);
  return Math.round(v * 100) + '%';
}
const ZONE_N = { Kick: [0.25, 0.3, 0.45, 0.05, 0.55, 0.1, 0.35, 0.3, 0.02, 0.4, 0.5], Snare: [0.6, 0.08, 0.35, 0.02, 0.4, 0.6, 0.6, 0.55, 0.1, 0.3, 0.6], Hats: [0.65, 0.02, 0.1, 0.01, 0.3, 0.92, 0.85, 0.4, 0.7, 0.2, 0.7], Perc: [0.7, 0.05, 0.3, 0.02, 0.35, 0.4, 0.6, 0.35, 0.15, 0.5, 0.5] };
function drumFresh(zone) { const base = ZONE_N[zone] || []; return SET.map((s, i) => i === 18 ? 1 : i === 17 ? 0.5 : i < 11 && base[i] != null ? clamp(base[i] + (rnd() - 0.5) * 0.18, 0, 1) : i >= 11 ? (i === 12 ? rnd() * 0.15 : i === 13 ? rnd() * 0.2 : i === 14 ? rnd() * 0.15 : i === 15 ? 0.75 + rnd() * 0.25 : rnd() * 0.3) : rnd()); }
const STYLES = ['None', 'Boom bap', 'Lo-fi', 'Strung', 'Neo soul'];
const STYLE_G = { None: [30, 40, 10, 20], 'Boom bap': [45, 40, 5, 35], 'Lo-fi': [60, 30, 0, 50], Strung: [70, 65, 30, 60], 'Neo soul': [65, 55, 10, 45] };
function grooveFresh(style) { const g = STYLE_G[style]; return { groove: clamp(g[0] + (rnd() - 0.5) * 30, 0, 100), complexity: clamp(g[1] + (rnd() - 0.5) * 30, 0, 100), forward: clamp(g[2] + (rnd() - 0.5) * 20, 0, 100), behind: clamp(g[3] + (rnd() - 0.5) * 30, 0, 100), feel: ['on', rnd() < 0.6 ? 'behind' : 'on', rnd() < 0.5 ? 'ahead' : 'on', ['ahead', 'on', 'behind'][Math.floor(rnd() * 3)]], ease: true }; }
function swingPct(g) { return 50 + g.groove / 100 * 16.7 * (g.ease ? clamp(90 / state.bpm, 0.45, 1.25) : 1); }
const PAT = ['9002003020810130', '0000900100009102', '8383838383838383', '0000000100000030'];
function loopFresh(g) { const c = (g ? g.complexity : 40) / 100; return { rows: PAT.map((p, r) => [...p].map((ch, k) => { let v = +ch / 9; if (rnd() < 0.12 + c * 0.25) v = v && !(r < 2 && k % 4 === 0) ? 0 : (r === 1 ? 0.35 : 0.5 + rnd() * 0.4); return +v.toFixed(2); })), swing: g ? swingPct(g) : 58 }; }

// ---------- state (example data)
const state = {
  tab: 'break', bpm: 92, playing: false,
  zone: 'Kick', audition: 'Boom bap', auditionOn: true,
  drums: { items: [], hear: 0, parent: 1, spread: 0.25, locks: Array(19).fill(false) },
  pads: [{ name: 'Kick 1', zone: 'Kick' }, { name: 'Snare 1', zone: 'Snare' }, { name: 'Hats 1', zone: 'Hats' }, { name: 'Hats 2', zone: 'Hats' }, { name: 'Drum 1', zone: 'None' }, { name: 'Perc 1', zone: 'Perc' }, null, null],
  style: 'Boom bap',
  groove: { items: [], hear: 1, parent: 1, spread: 0.25, locks: { groove: false, complexity: true, forward: false, behind: false } },
  keptGrooves: [null, null, null, null],
  seedFrom: 'B',
  chosen: [0, 1, 2, 5], // left to right; pad 1 plays the bottom row
  loops: { items: [], hear: 0, parent: 2, spread: 0.25 },
  rowLocks: [false, false, false, false],
  keptLoops: [null, null, null, null, null, null, null, null],
  open: { Body: true },

state.drums.items = [0, 1, 2, 3].map(() => drumFresh('Kick'));

function bump(L_, i, again) { L_.spread = clamp(L_.spread * (again ? 0.6 : 1.1), 0.02, 0.5); }
function freshItem(k, base) {
  if (k === 'drum') { const v = drumFresh(state.zone === 'None' ? ['Kick', 'Snare', 'Hats', 'Perc'][Math.floor(rnd() * 4)] : state.zone); if (base) return base.map((x, i) => i === 18 ? x : state.drums.locks[i] ? x : clamp(x + (rnd() - 0.5) * state.drums.spread, 0, 1)); return v; }
  if (k === 'groove') { const g = grooveFresh(state.style); if (base) { const G = state.groove; ['groove', 'complexity', 'forward', 'behind'].forEach(s => { g[s] = G.locks[s] ? base[s] : clamp(base[s] + (rnd() - 0.5) * G.spread * 120, 0, 100); }); g.feel = base.feel.map(f => rnd() < G.spread * 0.4 ? ['ahead', 'on', 'behind'][Math.floor(rnd() * 3)] : f); g.ease = base.ease; } return g; }
  const lp = loopFresh(seedGroove()); if (base) lp.rows = lp.rows.map((row, r) => state.rowLocks[r] ? base.rows[r].slice() : row.map((v, k) => rnd() < 0.75 ? base.rows[r][k] : v)); return lp;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const d = b.dataset, act = d.act;
  if (act === 'closesheet') { if (e.target === b || b.tagName === 'BUTTON') { document.getElementById('sheet-root').innerHTML = ''; } return; }
  switch (act) {
    case 'gotab': state.tab = d.v; draw(); window.scrollTo(0, 0); return;
    case 'play': state.playing = !state.playing; drawTop(); runHead(); return;
    case 'midi': toast('Drag MIDI: in the plugin this drags the loop into a clip and turns Playing off.'); return;
    case 'zone': state.zone = d.v; draw(); return;
    case 'aud': state.audition = d.v; state.auditionOn = true; draw(); return;
    case 'audon': state.auditionOn = !state.auditionOn; draw(); return;
    case 'style': state.style = d.v; draw(); toast('Style steers the next New or Breed.'); return;
    case 'hear': { const L_ = litOf(d.k); L_.hear = +d.i; if (d.k === 'groove') state.seedFrom = state.seedFrom; draw(); return; }
    case 'breed': case 'cross': { const k = d.k, L_ = litOf(k), i = +d.i; history[k].push(JSON.stringify(L_)); const again = i === L_.parent; bump(L_, i, again); const base = act === 'cross' ? L_.items[i] : L_.items[i]; L_.items = L_.items.map((x, j) => j === i || (act === 'cross' && j === L_.hear) ? x : freshItem(k, base)); L_.parent = i; if (act === 'breed') L_.hear = i; draw(); toast((act === 'breed' ? 'Bred from ' : 'Crossed ') + L[i] + (act === 'cross' ? ' with ' + L[L_.hear] : '') + '. Example data only.'); return; }
    case 'back': { const h = history[d.k]; if (!h.length) { toast('Nothing to go back to.'); return; } Object.assign(litOf(d.k), JSON.parse(h.pop())); draw(); return; }
    case 'new': { const k = d.k, L_ = litOf(k); history[k].push(JSON.stringify(L_)); L_.items = L_.items.map(() => freshItem(k)); L_.parent = -1; L_.hear = 0; L_.spread = 0.25; draw(); toast(k === 'loop' ? 'Four new loops from groove ' + state.seedFrom + '.' : 'Four new ' + (k === 'drum' ? 'drums' : 'grooves') + '.'); return; }
    case 'lock': { const i = +d.i; state.drums.locks[i] = !state.drums.locks[i]; draw(); return; }
    case 'glock': state.groove.locks[d.v] = !state.groove.locks[d.v]; draw(); return;
    case 'keep': { const D = state.drums, z = state.zone, n = state.pads.filter(p => p && p.zone === z).length + 1; state.pads[+d.i] = { name: (z === 'None' ? 'Drum' : z) + ' ' + n, zone: z, vals: D.items[D.hear].slice() }; draw(); toast('Kept ' + L[D.hear] + ' on pad ' + (36 + +d.i) + '.'); return; }
    case 'clearpad': { const i = +d.i; state.pads[i] = null; state.chosen = state.chosen.map(c => c === i ? -1 : c); draw(); return; }
    case 'playpad': toast('Plays pad ' + (36 + +d.i) + ' (no sound in this mock).'); return;
    case 'feel': { const g = state.groove.items[state.groove.hear]; g.feel[+d.r] = d.v; draw(); return; }
    case 'seed': state.seedFrom = L[state.groove.hear]; draw(); toast('Groove ' + state.seedFrom + ' seeds the break. New or Breed on the Break tab follows it.'); return;
    case 'keepgroove': { const n = state.keptGrooves.filter(Boolean).length + 1; state.keptGrooves[+d.i] = { name: 'Groove ' + n, g: JSON.parse(JSON.stringify(state.groove.items[state.groove.hear])) }; draw(); return; }
    case 'cleargroove': state.keptGrooves[+d.i] = null; draw(); return;
    case 'seedkept': state.seedFrom = state.keptGrooves[+d.i].name; draw(); toast(state.seedFrom + ' seeds the break.'); return;
    case 'choose': openSheet(+d.i); return;
    case 'pick': state.chosen[+d.slot] = +d.i; document.getElementById('sheet-root').innerHTML = ''; draw(); return;
    case 'rowlock': state.rowLocks[+d.r] = !state.rowLocks[+d.r]; draw(); return;
    case 'cell': { const lp = state.loops.items[state.loops.hear], r = +d.r, s = +d.s, v = lp.rows[r][s]; lp.rows[r][s] = !v ? 0.9 : v >= 0.45 ? 0.3 : 0; draw(); return; }
    case 'keeploop': state.keptLoops[+d.i] = JSON.parse(JSON.stringify(state.loops.items[state.loops.hear])); draw(); return;
    case 'clearloop': state.keptLoops[+d.i] = null; draw(); return;
    case 'playloop': toast('Switches to kept loop ' + (+d.i + 1) + ' (no sound in this mock).'); return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('sheet-root').innerHTML = ''; });
document.addEventListener('change', e => { if (e.target.dataset.act === 'ease') { state.groove.items[state.groove.hear].ease = e.target.checked; draw(); } });
document.addEventListener('toggle', e => { const t = e.target; if (t.classList && t.classList.contains('grp')) state.open[t.dataset.g] = t.open; }, true);
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset, n = +t.value / 1000, out = t.parentElement.querySelector('output');
  t.style.setProperty('--p', (n * 100).toFixed(1) + '%');
  if (d.set !== undefined) { const i = +d.set; state.drums.items[state.drums.hear][i] = n; out.textContent = fmt(i, n); }
  if (d.spread) { const L_ = litOf(d.spread); L_.spread = 0.02 + n * 0.48; out.textContent = L_.spread.toFixed(2); }
  if (d.gset) { const g = state.groove.items[state.groove.hear]; g[d.gset] = n * 100; out.textContent = Math.round(n * 100); const p = t.closest('.sl').nextElementSibling; if (p) p.textContent = grooveDesc(g)[d.gset]; }
  if (d.lswing) { const lp = state.loops.items[state.loops.hear]; lp.swing = 50 + n * 25; out.textContent = lp.swing.toFixed(0) + '%'; }
});
document.addEventListener('change', e => { const d = e.target.dataset; if (d.gset || d.set !== undefined || d.lswing) draw(); });

// a moving playhead while Playing is on, so the screen can be judged in motion
let raf = 0, t0 = 0;
function runHead() {
  cancelAnimationFrame(raf);
  const step = () => { const ph = document.getElementById('ph'); if (ph) { ph.hidden = !state.playing; if (state.playing) { const bar = 4 * 60 / state.bpm * 1000, f = ((performance.now() - t0) % bar) / bar; ph.style.left = (f * 100) + '%'; } } if (state.playing) raf = requestAnimationFrame(step); };
  t0 = performance.now(); step();
}
draw();
})();
</script>
