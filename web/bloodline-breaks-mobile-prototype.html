<title>Bloodline Breaks Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* PROTOTYPE, throwaway. Mobile first: three tabs (Drums, Groove, Break) under a sticky transport, a tab bar at the bottom; from 1000px the three panels sit side by side and the tab bar goes. One dark look, colours from the Bloodline Breaks 2 editor. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1f2229; --tile: #292d36; --edge: #3a3f4b; --fg: #e8e6e1; --muted: #8d8f96; --faint: #5d626d;
  --accent: #ff8c69; --parent: #ffc857; --keep: #9be564; --lock: #b39ddb; --groove: #f2c14e; --wild: #c9c6bf; --warn: #ff5d5d;
  --kick: #ff6b6b; --snare: #7cc6fe; --hat: #f4d35e; --perc: #9be564;
  --g1: #7cc6fe; --g2: #ff8c69; --g3: #9be564; --g4: #d59bf6; --g5: #f4d35e;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tabh: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font: 14px/1.4 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* transport */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--edge); }
.top-in { display: flex; align-items: center; gap: 8px; padding-block: 8px 4px; max-width: 1500px; margin: 0 auto; }
.brand { font: 700 15px var(--body); letter-spacing: 0.04em; margin-right: auto; white-space: nowrap; }
.playbtn { height: 40px; min-width: 88px; border-radius: 20px; border: 1.5px solid var(--edge); background: var(--tile); font-weight: 700; }
.playbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.bpm { display: flex; align-items: center; background: var(--panel); border-radius: 20px; height: 40px; }
.bpm button { width: 30px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 17px; }
.bpm span { font: 600 14px var(--mono); min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.exportbtn { height: 40px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--tile); padding: 0 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.status { max-width: 1500px; margin: 0 auto; padding-block: 0 6px; font: 11px var(--mono); color: var(--muted); display: flex; gap: 10px; white-space: nowrap; overflow: hidden; }
.status b { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.status .clip { color: var(--warn); }
@media (max-width: 440px) { .brand { font-size: 12px; letter-spacing: 0.02em; } .playbtn { min-width: 68px; } .exportbtn { padding: 0 7px; } .bpm button { width: 24px; } }

/* layout */
main { max-width: 1500px; margin: 0 auto; padding-block: 12px calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 20px); }
.panes { display: grid; gap: 14px; }
.pane { display: grid; gap: 12px; min-width: 0; align-content: start; }
.pane[data-pane]:not(.on) { display: none; }
@media (min-width: 1000px) {
  .panes { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .pane[data-pane]:not(.on) { display: grid; }
  .tabs { display: none !important; }
  main { padding-bottom: 32px; }
  .pane { background: color-mix(in srgb, var(--panel) 45%, var(--bg)); border-radius: 14px; padding: 12px; }
}
.pane-head { display: flex; align-items: baseline; gap: 8px; }
.pane-head h2 { margin: 0; font: 700 20px var(--body); }
.pane-head .n { font: 600 12px var(--mono); color: var(--faint); }
.pane-head p { margin: 0; font-size: 12px; color: var(--muted); }
.lab { font: 700 10px var(--body); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 17px; border: 1px solid var(--edge); background: var(--tile); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--on, var(--accent)); border-color: var(--on, var(--accent)); color: var(--bg); font-weight: 700; }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--tile); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.small { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.hot { border-color: var(--groove); color: var(--groove); font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.sl { display: grid; grid-template-columns: 74px minmax(0, 1fr) 58px; align-items: center; gap: 10px; }
.sl.lockable { grid-template-columns: 74px minmax(0, 1fr) 58px 58px; }
.sl > span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl output { font: 12px var(--mono); text-align: right; white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; background: none; height: 30px; width: 100%; min-width: 0; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sc, var(--accent)) var(--p, 50%), var(--tile) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sc, var(--accent)) var(--p, 50%), var(--tile) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--sc, var(--accent)); margin-top: -7px; border: 3px solid var(--bg); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--sc, var(--accent)); border: 3px solid var(--bg); }
.lock { height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--tile); font-size: 11px; font-weight: 600; }
.lock[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: var(--bg); }
.card { background: var(--panel); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.hint.warm { color: var(--parent); }

/* litters */
.litter { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--tile); border: 1px solid var(--edge); border-radius: 10px; padding: 8px; display: grid; gap: 6px; min-width: 0; text-align: left; }
.tile.hear { border: 2px solid var(--ta, var(--accent)); padding: 7px; background: color-mix(in srgb, var(--tile) 82%, var(--ta, var(--accent))); }
.tile .th { display: flex; align-items: baseline; gap: 6px; }
.tile .th b { font: 700 18px var(--body); }
.tile .th em { margin-left: auto; font: 700 11px var(--body); font-style: normal; color: var(--ta, var(--accent)); }
.tile .th em.par { color: var(--parent); }
.tile svg { display: block; width: 100%; height: 64px; }
.tile .meta { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile .acts .btn { height: 32px; padding: 0 4px; }
.hearzone { display: grid; gap: 6px; background: none; border: 0; padding: 0; text-align: left; width: 100%; }

/* settings accordion */
details.grp { border-top: 1px solid var(--edge); }
details.grp summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; font: 700 12px var(--body); letter-spacing: 0.08em; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
details.grp summary small { margin-left: auto; font: 11px var(--mono); color: var(--muted); letter-spacing: 0; font-weight: 400; }
details.grp summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 16px; }
details.grp[open] summary::after { content: "−"; }
details.grp .sets { display: grid; gap: 2px; padding-bottom: 10px; }

/* keep */
.keep { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pad { position: relative; min-height: 70px; border-radius: 8px; border: 1px solid var(--edge); background: var(--panel); padding: 5px 6px; display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
.pad.full { background: var(--tile); border-color: color-mix(in srgb, var(--kc) 70%, transparent); }
.pad.live { box-shadow: inset 0 0 0 2px var(--accent); }
.pad.target { border: 1.5px dashed var(--keep); background: color-mix(in srgb, var(--panel) 85%, var(--keep)); }
.pad .no { font: 10px var(--mono); color: var(--muted); }
.pad .nm { font: 700 12px var(--body); color: var(--kc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .dr { margin: auto; font-size: 11px; color: var(--muted); text-align: center; }
.pad .x { position: absolute; top: 2px; right: 3px; width: 24px; height: 24px; border: 0; background: none; color: var(--muted); font-size: 14px; }
.pad svg { display: block; width: 100%; height: 22px; margin-top: auto; }
.pad .used { position: absolute; bottom: 4px; right: 5px; font: 700 10px var(--mono); color: var(--bg); background: var(--kc); border-radius: 3px; padding: 0 4px; }

/* groove */
.gdesc { font-size: 12px; color: var(--muted); margin: -4px 0 4px; }
.feelrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.feelrow .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--kc); color: var(--bg); font: 700 11px var(--mono); display: flex; align-items: center; justify-content: center; }
.feelrow .who { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 12px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--sg, var(--groove)); color: var(--bg); font-weight: 700; }
.seedpill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid var(--groove); background: var(--tile); font-weight: 700; font-size: 13px; color: var(--groove); }
.seedpill svg { width: 44px; height: 16px; }

/* break */
.plays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { position: relative; height: 54px; border-radius: 8px; border: 1.5px solid var(--kc, var(--edge)); background: var(--tile); padding: 4px 6px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.slot .no { font: 700 10px var(--mono); color: var(--kc); }
.slot .nm { font: 700 12px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .to { font: 10px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.empty { border-style: dashed; color: var(--muted); }
.gridbox { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px; }
.rowheads { display: grid; grid-template-rows: 16px repeat(4, 1fr); gap: 3px; }
.rh { display: flex; align-items: center; gap: 4px; min-width: 0; }
.rh .tag { width: 18px; height: 18px; border-radius: 4px; background: var(--kc); color: var(--bg); font: 700 10px var(--mono); display: flex; align-items: center; justify-content: center; flex: none; }
.rh .nm { font-size: 10.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.rh .lk { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--edge); background: var(--tile); font: 700 9px var(--body); padding: 0; flex: none; }
.rh .lk[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: var(--bg); }
.steps { display: grid; grid-template-rows: 16px repeat(4, 1fr); gap: 3px; position: relative; }
.counts, .lane { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; }
.counts span { font: 9px var(--mono); color: var(--muted); text-align: center; }
.counts span.beat { color: var(--fg); }
.lane { height: 38px; border-radius: 4px; }
.lane.locked { background: color-mix(in srgb, transparent 84%, var(--lock)); }
.cell { position: relative; border: 0; padding: 0; border-radius: 3px; background: rgba(58,63,75,0.28); min-width: 0; }
.cell.beat { background: rgba(58,63,75,0.55); }
.cell i { position: absolute; left: 15%; right: 15%; bottom: 2px; border-radius: 2px; background: var(--kc); opacity: var(--o, 1); }
.playhead { position: absolute; top: 16px; bottom: 0; width: 2px; background: var(--fg); opacity: 0.75; pointer-events: none; left: 0; }
.map { font: 10.5px var(--mono); color: var(--muted); }
.shape4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.step { background: var(--tile); border-radius: 10px; padding: 8px; display: grid; gap: 6px; min-width: 0; }
.step.fixed { box-shadow: inset 0 0 0 1.5px var(--accent); }
.step b { font-size: 13px; }
.step small { display: block; font: 10px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepc { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 4px; align-items: center; }
.stepc button { height: 38px; border-radius: 8px; border: 1px solid var(--edge); background: var(--panel); font-size: 18px; }
.stepc button:disabled { opacity: 0.3; cursor: default; }
.stepc .v { border: 0; background: none; font: 600 17px var(--mono); }
.stepc .v.any { color: var(--muted); font: 600 13px var(--body); }
.rowchips .chip { display: inline-flex; align-items: center; gap: 6px; }
.rowchips .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--kc); }
.rowchips .chip[aria-pressed="true"] i { background: var(--bg); }
.rowchips .chip em { font-style: normal; font: 700 10px var(--mono); }
.barpick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.barpick button { height: 30px; border-radius: 6px; border: 1px solid var(--edge); background: var(--tile); font: 600 11px var(--mono); color: var(--muted); position: relative; overflow: hidden; }
.barpick button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); }
.barpick button.now::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--edge); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabh); max-width: 600px; margin: 0 auto; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.tab i { width: 26px; height: 4px; border-radius: 2px; background: var(--edge); }
.tab small { font: 10px var(--mono); font-weight: 400; }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"] i { background: var(--tc); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
@media (min-width: 1000px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.sheet h3 { margin: 0; font-size: 16px; }
.exp { display: grid; gap: 8px; }
.exp button { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--edge); background: var(--tile); }
.exp button b { font-size: 14px; }
.exp button span { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); background: var(--tile); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }
@media (min-width: 1000px) { .toast { bottom: 20px; } }
</style>

<script>
/* PROTOTYPE, wipe me. Bloodline Breaks, mobile first, with an engine.
   - Drums: Bloodline Drums' voice (19 settings, zones; Perc from plugins/bloodline-breaks-2/SPEC.md), a litter of
     four bred as in Bloodline Drums 2 (Cross takes whole setting groups), eight keep pads, a Loop audition.
   - Groove: four options bred with Groove, Complexity, Forward, Behind (docs/research/groove-and-drum-feel.md),
     a feel per row and locks; kept grooves. The heard or kept groove seeds the break.
   - Break: loops of 2 or 4 bars bred from the seed groove. Four chosen pads, left to right, play the rows from
     the bottom up; a row's part is written for its pad's zone and pulled to the Complexity target.
   Everything renders offline into one seamless loop, so what plays is what exports (mix WAV, or a zip with stems). */
(function () {
'use strict';
const SR = 44100;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const fold = v => { v = Math.abs(v); if (v > 1) v = 2 - v; return clamp(v, 0, 1); };
const dbg = db => Math.pow(10, db / 20);
const R = Math.random;
function gaussOf(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const gauss = () => gaussOf(R);
function poisson(l) { const E = Math.exp(-l); let k = 0, p = 1; do { k++; p *= R(); } while (p > E); return k - 1; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const newSeed = () => Math.floor(R() * 2147483646) + 1;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = 'ABCD';

// =====================================================================================
// Drums: settings, zones, voice (ported from plugins/bloodline-drums/core)
// =====================================================================================
const SET = [ // name, group, unit, min, max, log, bred
  ['Pitch', 0, 'Hz', 20, 2000, 1, 1], ['Sweep', 0, 'st', 0, 60, 0, 1], ['Sweep time', 0, 's', 0.002, 0.3, 1, 1], ['Attack', 0, 's', 0, 0.05, 0, 1], ['Decay', 0, 's', 0.005, 4, 1, 1],
  ['Body / Noise', 1, '%', 0, 1, 0, 1], ['Noise tone', 1, 'Hz', 100, 16000, 1, 1], ['Noise decay', 1, 's', 0.005, 4, 1, 1], ['Metal', 1, '%', 0, 1, 0, 1],
  ['Click', 2, '%', 0, 1, 0, 1], ['Click tone', 2, 'Hz', 500, 12000, 1, 1],
  ['Drive', 3, '%', 0, 1, 0, 1], ['Bits', 3, 'bits', 16, 2, 0, 1], ['Rate', 3, 'Hz', 48000, 1000, 1, 1],
  ['High-pass', 4, 'Hz', 20, 8000, 1, 1], ['Low-pass', 4, 'Hz', 200, 20000, 1, 1], ['Resonance', 4, '%', 0, 0.95, 0, 1], ['Pan', 4, 'pan', -1, 1, 0, 1], ['Level', 4, 'dB', -24, 0, 0, 0],
];
const GROUPS = ['Body', 'Noise', 'Click', 'Grit', 'Out'];
const GC = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)', 'var(--g5)'];
const PAN = 17, LEVEL = 18;
const ZONES = {
  Kick: [[40, 90], [3, 24], [0.015, 0.08], [0, 0.003], [0.15, 0.6], [0, 0.25], [200, 2000], [0.01, 0.08], [0, 0.05], [0.1, 0.8], [1000, 5000]],

function exportSheet() {
  const lp = sourceLoop(), secs = (lp.bars * 4 * 60 / state.bpm).toFixed(2), rows = state.chosen.filter(i => state.pads[i]).length;
  sheet('<h3>Export ' + (state.playingSlot >= 0 ? 'kept loop ' + (state.playingSlot + 1) : 'loop ' + L[state.loops.hear]) + '</h3><p class="hint">' + lp.bars + ' bars at ' + state.bpm + ' BPM, ' + secs + ' s, 44.1 kHz 16-bit stereo. It loops seamlessly: tails wrap round to the start.</p>' +
    '<div class="exp"><button data-act="exmix"><b>Mix WAV</b><span>The whole break, as you hear it.' + (inViewer ? ' Saved inside a .zip, the way claude.ai hands out audio.' : '') + '</span></button>' +
    '<button data-act="exstems"><b>Mix and stems</b><span>A .zip with the mix, a WAV per row (' + rows + ' rows) and the break as JSON.</span></button></div>');
}

// =====================================================================================
// Events
// =====================================================================================
let toastT = 0;
function toast(m) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
const litOf = k => k === 'drum' ? state.drums : k === 'groove' ? state.groove : state.loops;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const d = b.dataset, act = d.act;
  if (act === 'closesheet') { if (e.target === b || b.tagName === 'BUTTON') document.getElementById('sheet-root').innerHTML = ''; return; }
  switch (act) {
    case 'gotab': state.tab = d.v; draw(); window.scrollTo(0, 0); return;
    case 'play': if (state.playing) { stopAudio(); drawTop(); drawStatus(); } else play(state.mode === 'audition' || state.mode === 'inbreak' ? 'break' : state.mode); return;
    case 'bpm': state.bpm = clamp(state.bpm + +d.v, 60, 160); changed(); return;
    case 'export': exportSheet(); return;
    case 'exmix': document.getElementById('sheet-root').innerHTML = ''; exportMix(); return;
    case 'exstems': document.getElementById('sheet-root').innerHTML = ''; exportStems(); return;
    case 'zone': state.zone = d.v; draw(); toast('Zone steers the next New or Breed.'); return;
    case 'aud': state.audition = d.v; state.auditionOn = true; draw(); if (state.playing && (state.mode === 'audition' || state.mode === 'inbreak')) play(d.v === 'In break' ? 'inbreak' : 'audition'); return;
    case 'audon': state.auditionOn = !state.auditionOn; if (!state.auditionOn && (state.mode === 'audition' || state.mode === 'inbreak')) { state.mode = 'break'; refreshAudio(); } draw(); return;
    case 'style': state.style = d.v; draw(); toast('Style steers the next New or Breed.'); return;
    case 'hear': {
      const k = d.k, o = litOf(k), i = +d.i; o.hear = i;
      if (k === 'drum') { if (state.auditionOn) play(state.audition === 'In break' ? 'inbreak' : 'audition'); else oneShot(o.items[i]); }
      if (k === 'groove' && state.playing) state.mode = 'groove';
      if (k === 'loop') { state.playingSlot = -1; if (state.mode !== 'break') state.mode = 'break'; if (!state.playing) { draw(); play('break'); return; } }
      changed(); return;
    }
    case 'breed': case 'cross': { const k = d.k, o = litOf(k), i = +d.i, ops = OPS[k]; if (act === 'breed') litBreed(o, i, ops.mutate); else litCross(o, i, ops.cross, ops.mutate); if (k === 'loop') state.playingSlot = -1; if (k === 'drum' && state.auditionOn && state.playing) state.mode = state.audition === 'In break' ? 'inbreak' : 'audition'; changed(); return; }
    case 'back': { if (!litBack(litOf(d.k))) { toast('Nothing to go back to.'); return; } changed(); return; }
    case 'new': { const k = d.k; litNew(litOf(k), OPS[k].fresh); if (k === 'loop') state.playingSlot = -1; changed(); toast(k === 'loop' ? 'Four new loops from ' + seedLabel() + '.' : 'Four new ' + (k === 'drum' ? 'drums' : 'grooves') + '.'); return; }
    case 'lock': { const i = +d.i; state.drums.locks[i] = !state.drums.locks[i]; draw(); return; }
    case 'glock': state.groove.locks[d.v] = !state.groove.locks[d.v]; draw(); return;
    case 'keep': { const D = state.drums, z = state.zone, base = z === 'None' ? 'Drum' : z, n = state.pads.filter(p => p && p.name.startsWith(base + ' ')).length + 1; state.pads[+d.i] = { name: base + ' ' + n, zone: z, v: D.items[D.hear].slice() }; changed(); toast('Kept ' + L[D.hear] + ' on pad ' + (36 + +d.i) + '.'); return; }
    case 'clearpad': { const i = +d.i; state.pads[i] = null; changed(); return; }
    case 'playpad': oneShot(state.pads[+d.i].v); return;
    case 'feel': state.groove.items[state.groove.hear].feel[+d.r] = d.v; if (state.playing) state.mode = 'groove'; changed(); return;
    case 'seed': state.seedFrom = L[state.groove.hear]; draw(); toast('Groove ' + state.seedFrom + ' seeds the break. New or Breed on the Break tab follows it.'); return;
    case 'keepgroove': { const n = state.keptGrooves.filter(Boolean).length + 1; state.keptGrooves[+d.i] = { name: 'Groove ' + n, g: clone(state.groove.items[state.groove.hear]) }; draw(); return; }
    case 'cleargroove': { const k = state.keptGrooves[+d.i]; if (k && state.seedFrom === k.name) state.seedFrom = L[state.groove.hear]; state.keptGrooves[+d.i] = null; draw(); return; }
    case 'seedkept': state.seedFrom = state.keptGrooves[+d.i].name; draw(); toast(state.seedFrom + ' seeds the break.'); return;
    case 'choose': choosePadSheet(+d.i); return;
    case 'pick': state.chosen[+d.slot] = +d.i; document.getElementById('sheet-root').innerHTML = ''; changed(); return;
    case 'rowlock': state.rowLocks[+d.r] = !state.rowLocks[+d.r]; draw(); return;
    case 'bars': { const n = +d.v; if (n === state.bars) return; state.bars = n; snap(state.loops); state.loops.items = state.loops.items.map(lp => resize(lp, n)); state.viewBar = 0; state.playingSlot = -1; changed(); toast(n === 4 ? 'Four bars: each loop repeats; the next Breed varies the new bars.' : 'Two bars: each loop keeps its first two.'); return; }
    case 'viewbar': state.viewBar = +d.v; draw(); return;
    case 'shaperow': state.shapeRow = +d.v; draw(); return;
    case 'shape': case 'shapeany': {
      const sh = state.shape[state.shapeRow], k = d.k, now = rowNow(sourceLoop(), state.shapeRow);
      if (act === 'shapeany') { if (sh[k] < 0) sh[k] = Math.round(now[k]); else sh[k] = -1; }
      else if (sh[k] < 0) sh[k] = Math.round(now[k]) + (+d.d);
      else sh[k] += +d.d;
      if (k === 't') { const [lo, hi] = totalRange(sh); if (sh.t >= 0) sh.t = clamp(sh.t, lo, hi); }
      else { sh[k] = sh[k] < 0 ? -1 : clamp(sh[k], 0, CAP[k]); if (sh.t >= 0) { const [lo, hi] = totalRange(sh); sh.t = clamp(sh.t, lo, hi); } }
      draw(); return;
    }
    case 'fit': {
      const lp = sourceLoop(), roles = rolesNow(), has = hasOf(roles), c = seedGroove().complexity / 100; snap(state.loops);
      lp.rows = lp.rows.map((row, r) => { const role = roles[r]; if (!role || state.rowLocks[r] || !anyFixed(state.shape[r])) return row; return shapedMutate(row, role, c, has, 0, state.shape[r]); });
      changed(); toast('Fitted the rows that have settings. Back undoes it.'); return;
    }
    case 'cell': { const lp = sourceLoop(), r = +d.r, s = +d.s, v = lp.rows[r][s]; lp.rows[r][s] = !v ? 0.9 : v >= 0.45 ? 0.3 : 0; if (!lp.roles[r]) lp.roles[r] = roleOfRow(r); changed(); return; }
    case 'keeploop': state.keptLoops[+d.i] = clone(state.loops.items[state.loops.hear]); draw(); return;
    case 'clearloop': { const i = +d.i; state.keptLoops[i] = null; if (state.playingSlot === i) state.playingSlot = -1; changed(); return; }
    case 'playloop': state.playingSlot = +d.i; state.viewBar = 0; state.mode = 'break'; changed(); if (!state.playing) play('break'); return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('sheet-root').innerHTML = ''; });
document.addEventListener('toggle', e => { const t = e.target; if (t.classList && t.classList.contains('grp')) state.open[t.dataset.g] = t.open; }, true);
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset, n = +t.value / 1000, out = t.parentElement.querySelector('output'); if (!out) return;
  t.style.setProperty('--p', (n * 100).toFixed(1) + '%');
  if (d.set !== undefined) { const i = +d.set; state.drums.items[state.drums.hear][i] = n; out.textContent = fmt(i, n); if (state.playing && (state.mode === 'audition' || state.mode === 'inbreak')) refreshAudio(); }
  if (d.spread) { const o = litOf(d.spread); o.spread = 0.02 + n * 0.48; out.textContent = o.spread.toFixed(2); }
  if (d.gset) { const g = state.groove.items[state.groove.hear]; g[d.gset] = n * 100; out.textContent = Math.round(n * 100); const p = document.getElementById('gd-' + d.gset); if (p) p.textContent = grooveDesc(g)[d.gset]; if (state.playing) { state.mode = 'groove'; refreshAudio(); } }
  if (d.lswing) { const lp = sourceLoop(); lp.swing = 50 + n * 25; out.textContent = lp.swing.toFixed(0) + '%'; refreshAudio(); }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.act === 'ease') { state.groove.items[state.groove.hear].ease = t.checked; if (state.playing) state.mode = 'groove'; changed(); return; }
  if (d.gset || d.set !== undefined || d.lswing) draw();
});

// a moving playhead, following the bar on show
function tick() {
  const ph = document.getElementById('ph');
  if (ph) {
    const lp = sourceLoop(), on = state.playing && cur && (state.mode === 'break' || state.mode === 'groove' || state.mode === 'inbreak');
    if (on) { const p = position() * lp.bars, bar = Math.floor(p); ph.hidden = bar !== Math.min(state.viewBar, lp.bars - 1); ph.style.left = ((p - bar) * 100) + '%';
      for (let b = 0; b < lp.bars; b++) { const el = document.getElementById('vb-' + b); if (el) el.classList.toggle('now', b === bar); } }
    else ph.hidden = true;
  }
  requestAnimationFrame(tick);
}
draw(); requestAnimationFrame(tick);
})();
</script>
