<title>Bloodline Track</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* PROTOTYPE, throwaway. Phase 1 of issue #51: a silent UI mock, no sound. Track is home; a part opens in two steps
   (Sound, then Pattern). Phones: tabs Track / Sound / Pattern at the bottom. From 1000px: Track left, open part right.
   One dark look, colours from the Bloodline Breaks 2 editor, same as the Breaks mobile prototype. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1f2229; --tile: #292d36; --edge: #3a3f4b; --fg: #e8e6e1; --muted: #8d8f96; --faint: #5d626d;
  --accent: #ff8c69; --parent: #ffc857; --keep: #9be564; --lock: #b39ddb; --groove: #f2c14e; --wild: #c9c6bf; --warn: #ff5d5d;
  --kick: #ff6b6b; --snare: #7cc6fe; --hat: #f4d35e; --perc: #9be564;
  --bass: #5ad1b5; --synth: #d59bf6; --fx: #7cc6fe;
  --new: #9be564; --moved: #7cc6fe; --gone: #ff5d5d;
  --g1: #7cc6fe; --g2: #ff8c69; --g3: #9be564; --g4: #d59bf6; --g5: #f4d35e;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tabh: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font: 14px/1.4 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* transport */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--edge); }
.top-in { display: flex; align-items: center; gap: 8px; padding-block: 8px 4px; max-width: 1500px; margin: 0 auto; }
.brand { font: 700 15px var(--body); letter-spacing: 0.04em; margin-right: auto; white-space: nowrap; }
.playbtn { height: 40px; min-width: 80px; border-radius: 20px; border: 1.5px solid var(--edge); background: var(--tile); font-weight: 700; }
.playbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.bpm { display: flex; align-items: center; background: var(--panel); border-radius: 20px; height: 40px; }
.bpm button { width: 30px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 17px; }
.bpm span { font: 600 14px var(--mono); min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.topbtn { height: 40px; border-radius: 10px; border: 1.5px solid var(--edge); background: var(--tile); padding: 0 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.topbtn.exp { border-color: var(--accent); }
.topbtn[aria-pressed="true"] { background: var(--new); border-color: var(--new); color: var(--bg); }
.status { max-width: 1500px; margin: 0 auto; padding-block: 0 6px; font: 11px var(--mono); color: var(--muted); display: flex; gap: 10px; white-space: nowrap; overflow: hidden; }
.status b { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 440px) { .brand { font-size: 12px; letter-spacing: 0.02em; } .brand .long { display: none; } .playbtn { min-width: 56px; } .topbtn { padding: 0 7px; } .bpm button { width: 22px; } .top-in { gap: 6px; } }
.brand { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* layout */
main { max-width: 1500px; margin: 0 auto; padding-block: 12px calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 20px); }
.panes { display: grid; gap: 14px; }
.pane { display: grid; gap: 12px; min-width: 0; align-content: start; }
.pane[data-pane]:not(.on) { display: none; }
@media (min-width: 1000px) {
  .panes { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
  .pane[data-pane]:not(.on) { display: grid; }
  .tabs { display: none !important; }
  main { padding-bottom: 32px; }
  .pane { background: color-mix(in srgb, var(--panel) 45%, var(--bg)); border-radius: 14px; padding: 12px; }
}
.pane-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pane-head h2 { margin: 0; font: 700 20px var(--body); }
.pane-head p { margin: 0; font-size: 12px; color: var(--muted); }
.lab { font: 700 10px var(--body); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 17px; border: 1px solid var(--edge); background: var(--tile); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--on, var(--accent)); border-color: var(--on, var(--accent)); color: var(--bg); font-weight: 700; }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--tile); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.small { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.hot { border-color: var(--groove); color: var(--groove); font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.btn.ghost { background: none; }
.sl { display: grid; grid-template-columns: 74px minmax(0, 1fr) 58px; align-items: center; gap: 10px; }
.sl.lockable { grid-template-columns: 74px minmax(0, 1fr) 58px 58px; }
.sl > span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl output { font: 12px var(--mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; background: none; height: 30px; width: 100%; min-width: 0; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sc, var(--accent)) var(--p, 50%), var(--tile) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sc, var(--accent)) var(--p, 50%), var(--tile) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--sc, var(--accent)); margin-top: -7px; border: 3px solid var(--bg); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--sc, var(--accent)); border: 3px solid var(--bg); }
.lock { height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--tile); font-size: 11px; font-weight: 600; }
.lock[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: var(--bg); }
.card { background: var(--panel); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-width: 0; position: relative; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 12px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--sg, var(--groove)); color: var(--bg); font-weight: 700; }

/* change marks: shown with the Changes toggle */
.mark { display: none; }
.diff .mark { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font: 700 9.5px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); background: var(--mc); white-space: nowrap; vertical-align: middle; }
.diff .mk { box-shadow: 0 0 0 1.5px var(--mc); }
.mark.new, .mk.new { --mc: var(--new); } .mark.moved, .mk.moved { --mc: var(--moved); } .mark.gone, .mk.gone { --mc: var(--gone); }
.ghost-card { display: none; }
.ghost-card { --mc: var(--gone); }
.ghost-card.moved { --mc: var(--moved); }
.diff .ghost-card { display: grid; gap: 6px; border: 1.5px dashed var(--mc); border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 85%, var(--mc)); }
.ghost-card s { color: var(--muted); font-size: 13px; }
.ghost-card p { margin: 0; font-size: 12px; color: var(--muted); }

/* litters */
.litter { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--tile); border: 1px solid var(--edge); border-radius: 10px; padding: 8px; display: grid; gap: 6px; min-width: 0; text-align: left; }
.tile.hear { border: 2px solid var(--ta, var(--accent)); padding: 7px; background: color-mix(in srgb, var(--tile) 82%, var(--ta, var(--accent))); }
.tile .th { display: flex; align-items: baseline; gap: 6px; }
.tile .th b { font: 700 18px var(--body); }
.tile .th em { margin-left: auto; font: 700 11px var(--body); font-style: normal; color: var(--ta, var(--accent)); }
.tile svg { display: block; width: 100%; height: 56px; }
.tile .meta { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile .acts .btn { height: 32px; padding: 0 4px; }
.tile ul { margin: 0; padding: 0; list-style: none; font: 11px var(--mono); color: var(--fg); display: grid; gap: 2px; min-height: 56px; }
.tile ul li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hearzone { display: grid; gap: 6px; background: none; border: 0; padding: 0; text-align: left; width: 100%; }

/* track: globals */
.globals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gbox { background: var(--tile); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; min-width: 0; }
.gbox select { flex: 1 1 0; min-width: 0; height: 30px; border-radius: 6px; border: 1px solid var(--edge); background: var(--panel); padding: 0 6px; min-width: 0; }
.gbox .seg { justify-self: start; }
.seedpill { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 1.5px solid var(--groove); background: var(--tile); font-weight: 700; font-size: 13px; color: var(--groove); text-align: left; }
.seedpill svg { width: 72px; height: 22px; flex: none; }
.seedpill small { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: 400; }

/* lanes */
.lanes { display: grid; gap: 8px; }
.lanec { background: var(--tile); border: 1px solid var(--edge); border-left: 4px solid var(--lc); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; min-width: 0; }
.lanec.sel { border-color: var(--lc); box-shadow: inset 0 0 0 1px var(--lc); }
.lanec.draft { border-style: dashed; opacity: 0.9; }
.lanec.muted .lpic { opacity: 0.35; }
.lhead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lhead .open { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; border: 0; background: none; padding: 0; text-align: left; }
.lhead b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lhead .kind { font: 600 10px var(--mono); color: var(--lc); text-transform: uppercase; letter-spacing: 0.06em; flex: none; }
.lhead .more { width: 32px; height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--panel); font-size: 15px; line-height: 1; flex: none; }
.ms { display: inline-flex; gap: 4px; flex: none; }
.ms button { width: 30px; height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--panel); font: 700 11px var(--body); }
.ms button[aria-pressed="true"].m { background: var(--warn); border-color: var(--warn); color: var(--bg); }
.ms button[aria-pressed="true"].s { background: var(--hat); border-color: var(--hat); color: var(--bg); }
.lpic { display: block; width: 100%; height: 34px; border: 0; padding: 0; background: none; }
.lpic svg { display: block; width: 100%; height: 34px; }
.mix { display: grid; grid-template-columns: minmax(0, 1fr) 56px 58px; gap: 8px; align-items: center; }
.mix output { font: 11px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; width: var(--m); background: linear-gradient(90deg, var(--keep) 0 70%, var(--hat) 70% 88%, var(--warn) 88%); }
.lfoot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lfoot .pan { display: flex; align-items: center; gap: 6px; flex: 1 1 130px; min-width: 0; }
.lfoot .pan span { font: 10px var(--mono); color: var(--muted); width: 26px; text-align: right; flex: none; }
.lfoot .pan input { --sc: var(--muted); height: 24px; }
.fxbtn { height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--panel); font-size: 11px; font-weight: 600; padding: 0 8px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fxbtn.on { border-color: var(--fx); color: var(--fx); }
.fxbtn.byp { text-decoration: line-through; color: var(--muted); }
.swt { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.addrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.addbtn { height: 52px; border-radius: 10px; border: 1.5px dashed var(--ac); background: color-mix(in srgb, var(--panel) 88%, var(--ac)); display: grid; place-content: center; text-align: center; gap: 1px; }
.addbtn b { font-size: 13px; color: var(--ac); }
.addbtn small { font: 10px var(--mono); color: var(--muted); }
.empty { text-align: center; padding: 22px 12px; border: 1.5px dashed var(--edge); border-radius: 12px; display: grid; gap: 8px; justify-items: center; }
.empty b { font-size: 16px; }
.limit { font: 11px var(--mono); padding: 2px 8px; border-radius: 4px; background: var(--bg); color: var(--keep); }
.limit.on { color: var(--bg); background: var(--warn); }

/* part editor */
.stepper { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stepper button { height: 46px; border-radius: 10px; border: 1px solid var(--edge); background: var(--tile); display: flex; align-items: center; gap: 8px; padding: 0 12px; text-align: left; }
.stepper button i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-content: center; font: 700 11px var(--mono); font-style: normal; color: var(--muted); flex: none; }
.stepper button[aria-current="step"] { border-color: var(--pc); background: color-mix(in srgb, var(--tile) 80%, var(--pc)); }
.stepper button[aria-current="step"] i { background: var(--pc); border-color: var(--pc); color: var(--bg); }
.stepper button.done i { border-color: var(--pc); color: var(--pc); }
.stepper b { font-size: 13px; } .stepper small { display: block; font: 10px var(--mono); color: var(--muted); }
.partbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.partbar .grow { margin-right: auto; }
.nothing { padding: 26px 12px; text-align: center; color: var(--muted); border: 1.5px dashed var(--edge); border-radius: 12px; font-size: 13px; }

/* drums */
.keep { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pad { position: relative; min-height: 76px; border-radius: 8px; border: 1px solid var(--edge); background: var(--panel); padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.pad.full { background: var(--tile); border-color: color-mix(in srgb, var(--kc) 70%, transparent); }
.pad.target { border: 1.5px dashed var(--keep); background: color-mix(in srgb, var(--panel) 85%, var(--keep)); }
.pad .no { font: 10px var(--mono); color: var(--muted); }
.pad .nm { font: 700 12px var(--body); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .dr { margin: auto; font-size: 11px; color: var(--muted); text-align: center; }
.pad .used { position: absolute; top: 4px; right: 5px; font: 700 10px var(--mono); color: var(--bg); background: var(--kc); border-radius: 3px; padding: 0 4px; }
.labelbtn { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 11px; border: 0; background: var(--kc); color: var(--bg); font: 700 10.5px var(--body); max-width: 100%; }
.labelbtn::after { content: "▾"; font-size: 9px; }
.pad .zone { font: 9.5px var(--mono); color: var(--muted); margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.grp { border-top: 1px solid var(--edge); }
details.grp summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; font: 700 12px var(--body); letter-spacing: 0.08em; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
details.grp summary small { margin-left: auto; font: 11px var(--mono); color: var(--muted); letter-spacing: 0; font-weight: 400; }
details.grp summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 16px; }
details.grp[open] summary::after { content: "−"; }
.plays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { height: 54px; border-radius: 8px; border: 1.5px solid var(--kc, var(--edge)); background: var(--tile); padding: 4px 6px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.slot .no { font: 700 10px var(--mono); color: var(--kc); }
.slot .nm { font: 700 12px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .to { font: 10px var(--mono); color: var(--muted); }
.gridbox { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px; }
.rowheads { display: grid; grid-template-rows: 16px repeat(4, 38px); gap: 3px; }
.rh { display: flex; align-items: center; gap: 4px; min-width: 0; }
.rh .labelbtn { height: 20px; padding: 0 5px; font-size: 9.5px; flex: 1; min-width: 0; overflow: hidden; }
.rh .lk { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--edge); background: var(--tile); font: 700 9px var(--body); padding: 0; flex: none; }
.rh .lk[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: var(--bg); }
.steps { display: grid; grid-template-rows: 16px repeat(4, 38px); gap: 3px; }
.counts, .lane { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; }
.counts span { font: 9px var(--mono); color: var(--muted); text-align: center; }
.counts span.beat { color: var(--fg); }
.lane { border-radius: 4px; }
.lane.locked { background: color-mix(in srgb, transparent 84%, var(--lock)); }
.lane.stale { box-shadow: inset 0 0 0 1px var(--parent); }
.cell { position: relative; border: 0; padding: 0; border-radius: 3px; background: rgba(58,63,75,0.28); min-width: 0; }
.cell.beat { background: rgba(58,63,75,0.55); }
.cell i { position: absolute; left: 15%; right: 15%; bottom: 2px; border-radius: 2px; background: var(--kc); opacity: var(--o, 1); }
.rewrite { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: color-mix(in srgb, var(--panel) 80%, var(--parent)); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
.rewrite span { margin-right: auto; }
.feelrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.feelrow .who { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.feelrow .who i { width: 10px; height: 10px; border-radius: 3px; background: var(--kc); flex: none; }
.barpick { display: grid; gap: 4px; }
.barpick button { height: 30px; border-radius: 6px; border: 1px solid var(--edge); background: var(--tile); font: 600 11px var(--mono); color: var(--muted); }
.barpick button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); }

/* pitched */
.dtwhy { margin: -6px 0 2px 84px; font-size: 11px; }
@media (max-width: 440px) { .dtwhy { margin-left: 0; } }
.roll { display: block; width: 100%; height: 150px; border-radius: 8px; background: var(--bg); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--edge); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabh); max-width: 600px; margin: 0 auto; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
.tab:disabled { opacity: 0.35; cursor: default; }
.tab i { width: 26px; height: 4px; border-radius: 2px; background: var(--edge); }
.tab small { font: 10px var(--mono); font-weight: 400; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }

<script>

// ---------- made-up content

const LCOL = { Kick: 'var(--kick)', Snare: 'var(--snare)', Hats: 'var(--hat)', Perc: 'var(--perc)', None: 'var(--wild)' };
const ROLE = { Kick: 'kick', Snare: 'snare', Hats: 'hat', Perc: 'perc', None: 'drum' };

const ZONES = { bass: ['Sub', 'Pluck', 'Round', 'Growl'], synth: ['Pad', 'Pluck', 'Lead', 'Keys'] };
const DTRAITS = [ // name, what it steers
  ['Tight', 'How closely hits sit on the groove. Low drifts loose, high locks to the grid and swing.'],
  ['Dynamic', 'Accent range: loud beats against soft off-beats.'],
  ['Ghosts', 'Quiet notes between the main hits.'],
  ['Dense', 'How many hits a bar.'],
  ['Off beat', 'Hits away from the beat: syncopation.'],
  ['Repeat', 'How much later bars copy the first. Low changes every bar.'],
  ['Fills', 'Variation in the last beat before the loop comes round.'],
  ['Anchored', 'Keeps beat 1 and the backbeat fixed. Low lets them move.'],

const TRAITS = ['Tonal', 'Poly', 'Rhythmic', 'Off beat', 'Dynamic', 'Open', 'Dense', 'Long'];
const CHARS = ['Warm', 'Dusty', 'Wide', 'Bright', 'Dark', 'Wet'];

// ---------- state (the sketch from the spec, trimmed)
let laneN = 0;
const pads = [
  { name: 'Kick 1', zone: 'Kick', label: 'Kick', v: drumVals() }, { name: 'Snare 1', zone: 'Snare', label: 'Snare', v: drumVals() },

    sound: { zone: 'Kick', hear: 0, items: [0, 1, 2, 3].map(drumVals), pads: p },

const state = {

state.lanes.push(pitchedLane('bass', 'Sub line'));

const laneById = id => state.lanes.find(l => l.id === id) || (state.adding && state.adding.draft.id === id ? state.adding.draft : null);

// Track

    '<div class="menu"><button data-act="openlane" data-id="' + l.id + '" data-step="sound">Change sound</button><button data-act="openlane" data-id="' + l.id + '" data-step="pattern">Change pattern</button><button data-act="dup" data-id="' + l.id + '">Duplicate</button>' +
    '<button data-act="move" data-id="' + l.id + '" data-v="-1"' + (i === 0 ? ' disabled' : '') + '>Move up</button><button data-act="move" data-id="' + l.id + '" data-v="1"' + (i === state.lanes.length - 1 ? ' disabled' : '') + '>Move down</button><button class="danger" data-act="remove" data-id="' + l.id + '">Remove lane</button></div><p class="hint">Remove can be undone from the Track.</p>'); }
function relabelSheet(l, i) { const p = l.sound.pads[i];
  sheet('<h3>' + esc(p.name) + ' plays as</h3><div class="chips">' + LABELS.map(z => chip(z, p.label === z, 'setlabel', z, LCOL[z])).join('') + '</div>' +
    '<p class="hint">Bred as ' + p.zone + '. Changing the label leaves the sound alone; it only changes what the break writes for its row, from the next Breed or New, or now with Rewrite row. Two rows may share a label.</p>');
  document.querySelector('.sheet').dataset.lane = l.id; document.querySelector('.sheet').dataset.pad = i; }
function fxSheet(id) { const tgt = id === 'master' ? state.master : laneById(+id), name = id === 'master' ? 'Master' : tgt.name;
  if (!tgt.fx) tgt.fx = { ch: 'Warm', chain: fxChain('Warm'), bypass: false };
  if (!tgt.fx.items) tgt.fx.items = [tgt.fx.chain, ...[0, 1, 2].map(() => fxChain(tgt.fx.ch).map(f => ({ n: f.n, amt: clamp(f.amt + (R() - 0.5) * 0.4, 0, 1) })))], tgt.fx.hear = 0, tgt.fx.locks = [false, false, false];
  const F = tgt.fx;
  sheet('<div class="row between"><h3>Effects · ' + esc(name) + '</h3>' + mark('new') + '</div>' +
    '<div class="row between"><span class="lab">Character</span><span class="row"><button class="btn small" data-act="fxbypass" aria-pressed="' + F.bypass + '">' + (F.bypass ? 'Bypassed' : 'Bypass') + '</button><button class="btn small">Back</button><button class="btn small" data-act="fxnew">New</button></span></div>' +
    '<div class="chips">' + CHARS.map(c => chip(c, F.ch === c, 'fxchar', c, 'var(--fx)')).join('') + '</div>' +
    '<div class="litter">' + F.items.map((ch, i) => '<div class="tile' + (i === F.hear ? ' hear' : '') + '" style="--ta:var(--fx)"><button class="hearzone" data-act="fxhear" data-i="' + i + '"><div class="th"><b>' + L[i] + '</b>' + (i === F.hear ? '<em>hearing</em>' : '') + '</div><ul>' + ch.map(f => '<li>' + esc(f.n) + ' · ' + Math.round(f.amt * 100) + '%</li>').join('') + '</ul></button><div class="acts"><button class="btn">Breed</button><button class="btn"' + (i === F.hear ? ' disabled' : '') + '>Cross</button></div></div>').join('') + '</div>' +
    '<div class="fxparams">' + F.items[F.hear].map((f, k) => slider('fx-' + k, f.n, f.amt, Math.round(f.amt * 100) + '%', 'data-fxamt="' + k + '"', '<button class="lock" data-act="fxlock" data-i="' + k + '" aria-pressed="' + F.locks[k] + '">' + (F.locks[k] ? 'Locked' : 'Lock') + '</button>', 'var(--fx)')).join('') + '</div>' +
    '<p class="hint">Delay and gate times are in beats and follow ' + state.bpm + ' BPM. The chain heard is the one the lane uses.</p>');
  document.querySelector('.sheet').dataset.fx = id; }
function changesSheet() {
  const item = (k, t, d) => '<li><span class="mark ' + k + '" style="--mc:var(--' + k + ')">' + (k === 'gone' ? 'removed' : k) + '</span><span><b>' + t + '</b> ' + d + '</span></li>';
  sheet('<h3>Changes from Breaks mobile</h3><ul class="chlist">' +
    item('new', 'Track', 'is home: lanes for drums, bass and synth, each with level, pan, mute, solo, meter, feel, swing on or off, and effects.') +
    item('new', 'Master', 'level, effects and the −1 dB limiter with a readout; Auto level; Undo for mixing edits.') +
    item('new', 'Add part', 'in two steps, Sound then Pattern, with Cancel, Back to Sound and Add to track. The draft plays in the Track or alone.') +
    item('new', 'Labels on kept pads', 'Kick, Snare, Hats, Perc or None, from the pad or from its row. Rewrite row applies a new label to the current loop.') +
    item('new', 'Drum traits', 'under the break grid: Tight, Dynamic, Ghosts, Dense, Off beat, Repeat, Fills and Anchored, for all rows or one row, with locks.') +
    item('new', 'Bass and synth', 'voices bred from zones with a phrase in the Track\'s key, then note loops from traits. A bass can follow a drum lane\'s kick.') +
    item('new', 'Effects', 'a litter of four chains bred from a character, with bypass and locks, on every lane and the master.') +
    item('new', 'Key and scale', 'set once in the Track.') +
    item('moved', 'Groove', 'from its own tab into the Track\'s global card. It applies to every lane.') +
    item('moved', 'Bars and Less swing at faster tempos', 'into the Track. Tempo stays in the top bar.') +
    item('moved', 'Feel per row', 'from the Groove tab to the drum lane\'s Pattern step. Each lane has its own feel on the Track.') +
    item('gone', 'Groove tab', 'The tab bar is now Track, Sound and Pattern.') +
    item('gone', 'Notes per bar', 'card, its counts and Fit. Breeding uses the unshaped path.') +
    '</ul><p class="hint">With Changes on, the page marks each of these in place.</p>'); }

// =====================================================================================
// Frame
// =====================================================================================
function drawTop() {
  document.getElementById('top').innerHTML = '<div class="brand"><span class="long">BLOODLINE </span>TRACK</div>' +
    '<button class="topbtn" data-act="diff" aria-pressed="' + state.diff + '" title="Mark what changed since Breaks mobile">Changes</button>' +
    '<button class="topbtn exp" data-act="export">Export</button><button class="playbtn" data-act="play" aria-pressed="' + state.playing + '">' + (state.playing ? 'Stop' : 'Play') + '</button>' +
    '<div class="bpm"><button data-act="bpm" data-v="-2" aria-label="Slower">−</button><span>' + state.bpm + '</span><button data-act="bpm" data-v="2" aria-label="Faster">+</button></div>';
}
function drawStatus() { const l = openLane();
  document.getElementById('status').innerHTML = '<span>' + (state.playing ? 'Playing' : 'Stopped') + '</span><b>' + (state.adding ? 'Track + new ' + state.adding.kind + (state.draftAlone ? ', alone' : '') : 'Track · ' + state.lanes.length + ' lanes · ' + state.bars + ' bars') + '</b><span style="margin-left:auto">silent mock</span>'; }
function drawTabs() { const l = openLane();
  document.getElementById('tabs').innerHTML = [['track', 'Track', state.lanes.length + ' lanes', 'var(--accent)'], ['sound', 'Sound', l ? l.name : 'no part open', l ? KCOL[l.kind] : 'var(--edge)'], ['pattern', 'Pattern', l ? l.name : 'no part open', l ? KCOL[l.kind] : 'var(--edge)']].map(([k, n, s, c]) =>
    '<button class="tab" role="tab" data-act="gotab" data-v="' + k + '" aria-selected="' + (state.tab === k) + '" style="--tc:' + c + '"' + (k !== 'track' && !l ? ' disabled' : '') + '><i></i>' + n + '<small>' + esc(s) + '</small></button>').join(''); }
function draw() { const y = window.scrollY; document.body.classList.toggle('diff', state.diff); document.getElementById('panes').innerHTML = trackPane() + partPane(); drawTop(); drawTabs(); drawStatus(); window.scrollTo(0, y); }
let toastT = 0;
function toast(m) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
function goStep(step) { state.step = step; state.tab = step; draw(); if (window.innerWidth < 1000) window.scrollTo(0, 0); }

// =====================================================================================
// Events
// =====================================================================================
const litOf = (k, l) => k === 'groove' ? state.groove : k === 'drum' || k === 'voice' ? l.sound : l.pattern;
function reroll(k, l, i) { const o = litOf(k, l);
  if (k === 'groove') o.items = o.items.map((x, j) => j === i ? x : grooveItem());
  else if (k === 'drum') o.items = o.items.map((x, j) => j === i ? x : drumVals());
  else if (k === 'voice') o.items = o.items.map((x, j) => j === i ? x : Array.from({ length: 8 }, () => R()));
  else if (k === 'loop') o.items = o.items.map((x, j) => j === i ? x : l.pattern.chosen.map((pi, r) => l.pattern.rowLocks[r] ? l.pattern.rows[r].slice() : part(l.sound.pads[pi] ? ROLE[l.sound.pads[pi].label] : 'drum', state.bars)));
  else o.items = o.items.map((x, j) => j === i ? x : notes(l.kind, state.bars));
  if (k === 'loop') { const P = l.pattern; P.writtenAs = P.chosen.map(pi => l.sound.pads[pi] && l.sound.pads[pi].label); P.rows = P.items[P.hear]; } }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const d = b.dataset, act = d.act;
  if (act === 'closesheet') { if (e.target === b || b.tagName === 'BUTTON') closeSheet(); return; }
  const l = d.id && d.id !== 'master' ? laneById(+d.id) : openLane();
  switch (act) {
    case 'diff': state.diff = !state.diff; draw(); if (state.diff) changesSheet(); return;
    case 'gotab': state.tab = d.v; if (d.v !== 'track') state.step = d.v; draw(); window.scrollTo(0, 0); return;
    case 'play': state.playing = !state.playing; drawTop(); drawStatus(); if (state.playing) toast('Silent mock: the engine comes in phase 2.'); return;
    case 'bpm': state.bpm = clamp(state.bpm + +d.v, 60, 160); draw(); return;
    case 'export': sheet('<h3>Export the Track</h3><div class="menu"><button>Mix WAV</button><button>Mix and stems: a .zip with the mix, a stem per lane (' + state.lanes.length + ') and the Track as JSON</button></div><p class="hint">Stems add up to the mix; tails wrap round to the start. Works in phase 2.</p>'); return;
    case 'grooveopen': state.groove.open = !state.groove.open; draw(); return;
    case 'seed': state.groove.seed = L[state.groove.hear]; draw(); toast('Groove ' + state.groove.seed + ' now sets swing for every lane.'); return;
    case 'glock': state.groove.locks[d.v] = !state.groove.locks[d.v]; draw(); return;
    case 'keepgroove': state.groove.kept[+d.i] = { name: 'Groove ' + (state.groove.kept.filter(Boolean).length + 1), g: clone(state.groove.items[state.groove.hear]) }; draw(); return;
    case 'bars': state.bars = +d.v; state.lanes.forEach(x => { if (x.kind === 'drums') { x.pattern.rows = x.pattern.rows.map(r => state.bars === 4 ? r.slice(0, 32).concat(r.slice(0, 32)) : r.slice(0, 32)); x.pattern.items = x.pattern.items.map(it => it.map(r => state.bars === 4 ? r.slice(0, 32).concat(r.slice(0, 32)) : r.slice(0, 32))); } }); draw(); return;
    case 'mute': snapshot('mute'); l.mute = !l.mute; draw(); return;
    case 'solo': snapshot('solo'); l.solo = !l.solo; draw(); return;
    case 'levellock': l.levelLocked = !l.levelLocked; draw(); return;
    case 'lanefeel': snapshot('feel'); l.feel = d.v; draw(); return;
    case 'followswing': return;
    case 'fx': fxSheet(d.id); return;
    case 'lanemenu': laneMenu(l); return;
    case 'openlane': closeSheet(); state.sel = l.id; goStep(d.step || state.step || 'sound'); return;
    case 'closepart': state.tab = 'track'; draw(); return;
    case 'dup': { closeSheet(); snapshot('duplicate'); const c = clone(l); c.id = ++laneN; c.name = l.name + ' 2'; c.solo = false; state.lanes.splice(state.lanes.indexOf(l) + 1, 0, c); draw(); toast('Duplicated ' + l.name + '.'); return; }
    case 'move': { closeSheet(); snapshot('move'); const i = state.lanes.indexOf(l), j = i + +d.v; state.lanes.splice(i, 1); state.lanes.splice(j, 0, l); draw(); return; }
    case 'remove': { closeSheet(); snapshot('remove'); state.lanes.splice(state.lanes.indexOf(l), 1); if (state.sel === l.id) { state.sel = state.lanes[0] ? state.lanes[0].id : null; state.tab = 'track'; } draw(); toast('Removed ' + l.name + '. Undo brings it back.'); return; }
    case 'undo': { const u = state.undo.pop(); if (!u) return; state.lanes = u.lanes; state.master = u.master; if (!laneById(state.sel)) state.sel = state.lanes[0] ? state.lanes[0].id : null; draw(); toast('Undid ' + u.what + '.'); return; }
    case 'autolevel': { snapshot('auto level'); const free = state.lanes.filter(x => !x.levelLocked); free.forEach(x => { x.level = x.kind === 'drums' ? 0.74 : x.kind === 'bass' ? 0.66 : 0.52; }); let pk = masterPeakDb(); if (pk > -1.5) { const k = Math.pow(10, (-1.5 - pk) / 20); free.forEach(x => { x.level *= k; }); } draw(); toast('Auto level set ' + free.length + ' lane' + (free.length === 1 ? '' : 's') + (state.lanes.length > free.length ? '; locked lanes kept' : '') + '. Drum rows keep their own levels.'); return; }
    case 'add': { const k = d.v, n = state.lanes.filter(x => x.kind === k).length + 1, name = (k === 'drums' ? 'Drums ' : k === 'bass' ? 'Bass ' : 'Synth ') + n;
      const draft = k === 'drums' ? drumLane(name, [null, null, null, null, null, null, null, null], [0, 1, 2, 3]) : pitchedLane(k, name);
      if (k === 'drums') { draft.sound.pads = [{ name: 'Kick 2', zone: 'Kick', label: 'Kick', v: drumVals() }, { name: 'Drum 2', zone: 'None', label: 'None', v: drumVals() }, null, null, null, null, null, null]; draft.pattern.chosen = [0, 1, 2, 3]; draft.pattern.writtenAs = ['Kick', 'None', null, null]; draft.pattern.rows = [part('kick', state.bars), part('drum', state.bars), new Array(state.bars * 16).fill(0), new Array(state.bars * 16).fill(0)]; draft.pattern.items = [0, 1, 2, 3].map(() => draft.pattern.rows.map(r => r.slice())); }
      state.adding = { kind: k, draft }; goStep('sound'); return; }
    case 'cancel': state.adding = null; state.tab = 'track'; draw(); toast('Cancelled. Nothing was added.'); return;
    case 'addtotrack': { const dr = state.adding.draft; snapshot('add part'); state.lanes.push(dr); state.adding = null; state.sel = dr.id; state.tab = 'track'; draw(); toast(dr.name + ' added to the Track.'); return; }
    case 'draftalone': state.draftAlone = d.v === 'alone'; draw(); return;
    case 'step': goStep(d.v); return;
    case 'hear': { const o = litOf(d.k, l); o.hear = +d.i; if (d.k === 'loop') l.pattern.rows = o.items[o.hear]; draw(); return; }
    case 'breed': case 'cross': { const o = litOf(d.k, l); o.hear = +d.i; reroll(d.k, l, +d.i); draw(); return; }
    case 'new': { const o = litOf(d.k, l); reroll(d.k, l, -1); o.hear = 0; if (d.k === 'loop') l.pattern.rows = o.items[0]; draw(); toast('Four new.'); return; }
    case 'back': toast('Back steps through this litter\'s history (phase 2).'); return;
    case 'zone': l.sound.zone = d.v; draw(); return;
    case 'pzone': l.sound.zone = d.v; draw(); return;
    case 'phrase': l.sound.phrase = d.v; draw(); return;
    case 'follow': l.pattern.follow = +d.v; draw(); return;
    case 'keepdrum': { const S = l.sound, z = S.zone, base = z === 'None' ? 'Drum' : z, n = S.pads.filter(p => p && p.name.startsWith(base + ' ')).length + 1; S.pads[+d.i] = { name: base + ' ' + n, zone: z, label: z, v: S.items[S.hear].slice() }; draw(); return; }
    case 'keepvoice': l.sound.kept[+d.i] = { name: l.sound.zone + ' ' + (l.sound.kept.filter(Boolean).length + 1), v: l.sound.items[l.sound.hear].slice() }; draw(); return;
    case 'keeploop': l.pattern.kept[+d.i] = clone(l.pattern.items[l.pattern.hear]); draw(); return;
    case 'keepnotes': l.pattern.kept[+d.i] = clone(l.pattern.items[l.pattern.hear]); draw(); return;
    case 'relabel': relabelSheet(l, +d.i); return;
    case 'setlabel': { const sh = document.querySelector('.sheet'), ln = laneById(+sh.dataset.lane), p = ln.sound.pads[+sh.dataset.pad]; if (p.label === d.v) return; snapshot('relabel'); p.label = d.v; closeSheet(); draw(); toast(p.name + ' plays as ' + d.v + ' from the next Breed or New.'); return; }
    case 'rewrite': { const r = +d.r, P = l.pattern, p = l.sound.pads[P.chosen[r]]; snapshot('rewrite row'); P.rows[r] = part(ROLE[p.label], state.bars); P.writtenAs[r] = p.label; draw(); toast('Row ' + (r + 1) + ' rewritten as ' + p.label + '.'); return; }
    case 'tscope': l.pattern.traitScope = +d.v; draw(); return;
    case 'tfollow': l.pattern.rowTraits[l.pattern.traitScope] = null; draw(); return;
    case 'dtlock': l.pattern.traitLocks[+d.i] = !l.pattern.traitLocks[+d.i]; draw(); return;
    case 'rowlock': l.pattern.rowLocks[+d.r] = !l.pattern.rowLocks[+d.r]; draw(); return;
    case 'rowfeel': l.pattern.rowFeel[+d.r] = d.v; draw(); return;
    case 'choose': { const S = l.sound, slot = +d.i; sheet('<h3>Row ' + (slot + 1) + ' plays</h3><div class="keep">' + S.pads.map((p, i) => p ? '<button class="pad full" data-act="pick" data-id="' + l.id + '" data-slot="' + slot + '" data-i="' + i + '" style="--kc:' + LCOL[p.label] + '"><span class="no">' + (36 + i) + '</span><span class="nm">' + esc(p.name) + '</span><span class="labelbtn" style="pointer-events:none">' + p.label + '</span></button>' : '<div class="pad"><span class="no">' + (36 + i) + '</span><span class="dr">empty</span></div>').join('') + '</div>'); return; }
    case 'pick': l.pattern.chosen[+d.slot] = +d.i; closeSheet(); draw(); return;
    case 'cell': { const P = l.pattern, r = +d.r, s = +d.s, v = P.rows[r][s]; P.rows[r][s] = !v ? 0.9 : v >= 0.45 ? 0.3 : 0; draw(); return; }
    case 'fxchar': case 'fxnew': case 'fxhear': case 'fxbypass': case 'fxlock': { const sh = document.querySelector('.sheet'), id = sh.dataset.fx, tgt = id === 'master' ? state.master : laneById(+id), F = tgt.fx;
      if (act === 'fxchar') { F.ch = d.v; F.items = [0, 1, 2, 3].map(() => fxChain(d.v)); F.hear = 0; }
      if (act === 'fxnew') { F.items = [0, 1, 2, 3].map(() => fxChain(F.ch)); F.hear = 0; }
      if (act === 'fxhear') F.hear = +d.i;
      if (act === 'fxbypass') F.bypass = !F.bypass;
      if (act === 'fxlock') F.locks[+d.i] = !F.locks[+d.i];
      F.chain = F.items[F.hear]; fxSheet(id); draw(); return; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let slideSnap = false;
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset, n = +t.value / 1000; if (t.type === 'range') t.style.setProperty('--p', (n * 100).toFixed(1) + '%');
  if (d.level || d.pan) { if (!slideSnap) { snapshot(d.level ? 'level' : 'pan'); slideSnap = true; } }
  if (d.level) { const l = laneById(+d.level); l.level = n; document.getElementById('lvo-' + l.id).textContent = db(n) + ' dB'; }
  if (d.pan) { const l = laneById(+d.pan); l.pan = n * 2 - 1; document.getElementById('pno-' + l.id).textContent = panTxt(l.pan); }
  if (d.mlevel) { state.master.level = n; t.parentElement.querySelector('output').textContent = db(n * 0.78) + ' dB'; }
  if (d.gset) { state.groove.items[state.groove.hear][d.gset] = n * 100; t.parentElement.querySelector('output').textContent = Math.round(n * 100); }
  if (d.dtrait) { const l = openLane(), P = l.pattern, sc = P.traitScope; if (sc >= 0 && !P.rowTraits[sc]) P.rowTraits[sc] = P.traits.slice(); const arr = sc >= 0 ? P.rowTraits[sc] : P.traits; arr[+d.dtrait] = n; t.parentElement.querySelector('output').textContent = Math.round(n * 100); }
  if (d.trait) { const l = openLane(); l.pattern.traits[+d.trait] = n; t.parentElement.querySelector('output').textContent = Math.round(n * 100); }
  if (d.fxamt) { const id = document.querySelector('.sheet').dataset.fx, tgt = id === 'master' ? state.master : laneById(+id); tgt.fx.chain[+d.fxamt].amt = n; t.parentElement.querySelector('output').textContent = Math.round(n * 100) + '%'; }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset; slideSnap = false;
  if (d.sel) { state[d.sel] = t.value; draw(); return; }
  if (d.act === 'ease') { state.ease = t.checked; draw(); return; }
  if (d.act === 'followswing') { const l = laneById(+d.id); snapshot('swing'); l.followSwing = t.checked; draw(); toast(l.name + (t.checked ? ' follows the groove\'s swing.' : ' plays straight.')); return; }
  if (d.rename) { const l = laneById(+d.rename); if (t.value.trim()) { snapshot('rename'); l.name = t.value.trim(); draw(); } return; }
  if (d.level || d.pan || d.mlevel || d.gset || d.dtrait) draw();
});
window.trackMockGo = function (fn) { fn(state); draw(); }; // screenshots set up states through this
draw();
})();
</script>
