<title>Drums and Patterns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="dp-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style id="dp-style">
/* PROTOTYPE, throwaway. Layout: 1 Bloodline Drums (kit and workbench, inspector beside), 2 Bloodline Breaks (dials, litter, heard loop), 3 Master. One deliberate dark look, matching the Bloodline sketches. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1e2128; --panel-2: #262a33; --line: #343945; --fg: #ece8e1; --muted: #8d929d; --faint: #5d626d;
  --kick: #ff6f61; --snare: #6cb6ff; --hat: #f2c94c; --drum: #7ddc8a; --none: #5d626d; --master: #5fd3c4; --fx: #b48cff; --keep: #f2c14e; --lock: #c9b8ff; --warn: #ff8a65; --band: rgba(95, 211, 196, 0.16);
  --display: 'Space Grotesk', 'Avenir Next', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

.pad-x { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font: 700 18px/1 var(--display); }

.bpm { display: flex; align-items: center; background: var(--panel); border-radius: 19px; height: 38px; }

.stage-head .n { font: 500 13px var(--mono); color: var(--faint); }

.two { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .two { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); } .two > .stage:last-child { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); } }

.card.bench { background: var(--panel-2); }

.seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }

.inst.byp { opacity: 0.55; }
.inst-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.inst-head .t { font: 600 13px var(--display); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.inst-head .sum { font: 11px var(--mono); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 120px; }
.cands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

.cand.hear { border-color: var(--acc); }

label.chk { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }
.writing { margin: 0; font-size: 13px; max-width: 80ch; }

.sync-scale { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--faint); margin-top: 4px; }
details.state { background: var(--panel); border-radius: 10px; padding: 8px 12px; }
details.state summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.state pre { margin: 8px 0 0; font: 11px/1.45 var(--mono); color: var(--muted); max-height: 360px; overflow: auto; white-space: pre; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
</style>

<script id="dp-script">
/* PROTOTYPE, wipe me. Drums and Patterns, second pass.
   1 Bloodline Drums: a workbench row of three pads (A, B, C) bred by choosing, placed into three kit slots.
     The voice, its 19 settings, zones and breeding are ported from plugins/bloodline-drums/core.
   2 Bloodline Breaks: a litter of eight two-bar loops bred with Breed, Cross, Back and Fresh. Its lanes are the
     three kit slots. A lane only gets a kick, snare or hat part when its slot holds a row made in that zone; a
     row made in None is a wildcard lane; a blank slot gets nothing. Groove, Complexity, Forward and Behind
     (docs/research/groove-and-drum-feel.md) replace Breaks' swing, style and pull: they steer the next breed.
   Effects: each slot and the master hold a chain of Bloodline Effects instances, none at first; + adds one.
     The twelve effects, chain breeding and the per-instance DC blocker and limiter are ported from
     plugins/bloodline-effects/core.
   Everything renders offline in JS into one seamless loop, which plays and downloads as the same audio. */
(function () {
'use strict';
const SR = 44100, BARS = 2, STEPS = 32;

// ---------- maths
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const fold = v => { v = Math.abs(v); if (v > 1) v = 2 - v; return clamp(v, 0, 1); };
const dbg = db => Math.pow(10, db / 20);
const R = Math.random;
function gaussOf(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const gauss = () => gaussOf(R);
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const newSeed = () => Math.floor(R() * 2147483646) + 1;
const clone = o => JSON.parse(JSON.stringify(o));

// =====================================================================================
// 1. Bloodline Drums: settings, zones, rows, voice
// =====================================================================================
const SET = [ // name, unit, min, max, log, bred (from plugins/bloodline-drums/core/settings.cpp)
  ['Pitch', 'Hz', 20, 2000, true, true], ['Sweep', 'st', 0, 60, false, true], ['Sweep time', 's', 0.002, 0.3, true, true],
  ['Attack', 's', 0, 0.05, false, true], ['Decay', 's', 0.005, 4, true, true], ['Body / Noise', '', 0, 1, false, true],
  ['Noise tone', 'Hz', 100, 16000, true, true], ['Noise decay', 's', 0.005, 4, true, true], ['Metal', '', 0, 1, false, true],
  ['Click', '', 0, 1, false, true], ['Click tone', 'Hz', 500, 12000, true, true], ['Drive', '', 0, 1, false, true],
  ['Bits', '', 16, 2, false, true], ['Rate', 'Hz', 48000, 1000, true, true], ['High-pass', 'Hz', 20, 8000, true, true],
  ['Low-pass', 'Hz', 200, 20000, true, true], ['Resonance', '', 0, 0.95, false, true], ['Pan', '', -1, 1, false, true],
  ['Level', 'dB', -24, 0, false, false],
];
const GROUPS = [['Body', 0, 5], ['Noise', 5, 4], ['Click', 9, 2], ['Grit', 11, 3], ['Out', 14, 5]];
const LEVEL = 18, PAN = 17;
const ZONES = {
  Kick: [[40, 90], [3, 24], [0.015, 0.08], [0, 0.003], [0.15, 0.6], [0, 0.25], [200, 2000], [0.01, 0.08], [0, 0.05], [0.1, 0.8], [1000, 5000]],
  Snare: [[150, 280], [0, 8], [0.01, 0.05], [0, 0.002], [0.08, 0.35], [0.4, 0.8], [1500, 6000], [0.1, 0.4], [0, 0.2], [0, 0.6], [2000, 8000]],
  Hats: [[100, 400], [0, 2], [0.002, 0.02], [0, 0.001], [0.03, 0.8], [0.85, 1], [5000, 16000], [0.03, 0.8], [0.4, 1], [0, 0.4], [4000, 12000]],
};
const TUNE = { start: 0.25, min: 0.02, max: 0.5, narrow: 0.6, widen: 1.6, zoneShare: 0.8, pull: 0.5 };
function toReal(i, n) { const s = SET[i]; n = clamp(n, 0, 1); return s[4] ? s[2] * Math.pow(s[3] / s[2], n) : s[2] + (s[3] - s[2]) * n; }
function toNorm(i, x) { const s = SET[i]; x = clamp(x, Math.min(s[2], s[3]), Math.max(s[2], s[3])); return s[4] ? Math.log(x / s[2]) / Math.log(s[3] / s[2]) : (x - s[2]) / (s[3] - s[2]); }
function zoneRange(zone, i) { if (zone === 'None' || i > 10) return [0, 1]; const z = ZONES[zone][i], a = toNorm(i, z[0]), b = toNorm(i, z[1]); return [Math.min(a, b), Math.max(a, b)]; }
function fmtSet(i, n) {
  const v = toReal(i, n), u = SET[i][1];
  if (u === 'Hz') return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 1 : 2) + ' kHz' : Math.round(v) + ' Hz';
  if (u === 's') return v >= 1 ? v.toFixed(2) + ' s' : (v * 1000).toFixed(v < 0.01 ? 1 : 0) + ' ms';
  if (u === 'st') return v.toFixed(1) + ' st';
  if (u === 'dB') return v.toFixed(1) + ' dB';
  if (i === 12) return v.toFixed(1) + ' bits';
  if (i === PAN) return Math.abs(v) < 0.005 ? 'C' : (v < 0 ? 'L' : 'R') + Math.round(Math.abs(v) * 100);
  return Math.round(v * 100) + '%';
}
const ZONE_ROLE = { Kick: 'kick', Snare: 'snare', Hats: 'hat', None: 'drum' };
const ROLE_NAME = { kick: 'Kick', snare: 'Snare', hat: 'Hats', drum: 'Wildcard' };
const ZONE_COL = { Kick: 'kick', Snare: 'snare', Hats: 'hat', None: 'drum' };

function freshDraw(zone) {
  const v = [];
  for (let i = 0; i < SET.length; i++) { let r = [0, 1]; if (zone !== 'None' && R() < TUNE.zoneShare) r = zoneRange(zone, i); v.push(lerp(r[0], r[1], R())); }
  v[LEVEL] = 1; return v; // Level starts at 0 dB, never bred
}
function newRow(zone) { return { zone, pads: [0, 1, 2].map(() => freshDraw(zone)), fav: -1, pressed: -1, last: -1, spread: TUNE.start, newCount: 0, locks: Array(SET.length).fill(false), pan: 0, level: 0, mono: zone === 'Kick', open: true, fx: [] }; }
function mutatePad(row, from, ownLevel) {
  return from.map((x, i) => {
    if (!SET[i][5]) return ownLevel;
    if (row.locks[i]) return x;
    let y = fold(x + gauss() * row.spread);
    if (row.zone !== 'None') { const [lo, hi] = zoneRange(row.zone, i); if (y < lo) y += (lo - y) * TUNE.pull; else if (y > hi) y -= (y - hi) * TUNE.pull; }
    return y;
  });
}
function chooseRow(row) {
  if (row.pressed < 0) return false;
  const p = row.pressed;
  if (row.fav >= 0) {
    if (p === row.fav) { row.spread = Math.max(TUNE.min, row.spread * TUNE.narrow); row.newCount = 0; }
    else if (++row.newCount >= 2) { row.spread = Math.min(TUNE.max, row.spread * TUNE.widen); row.newCount = 0; }
  }
  row.fav = p; row.pressed = -1; row.last = p;
  const fav = row.pads[p];
  row.pads = row.pads.map((pad, k) => k === p ? pad : mutatePad(row, fav, pad[LEVEL]));
  return true;
}
function resetRow(row) { row.pads = [0, 1, 2].map(() => freshDraw(row.zone)); row.fav = row.pressed = row.last = -1; row.spread = TUNE.start; row.newCount = 0; }
function padPan(row, p) { return row.mono ? 0 : clamp(toReal(PAN, row.pads[p][PAN]) + row.pan, -1, 1); }
function padLevel(row, p) { return toReal(LEVEL, row.pads[p][LEVEL]) + row.level; }

// The voice: a port of plugins/bloodline-drums/core/voice.cpp. Renders one hit, mono, until it dies or maxN.
const K808 = [205.3, 304.4, 369.6, 522.7, 540, 800];
const coefFor = (sec, target) => Math.exp(Math.log(target) / Math.max(1, sec * SR));
const gFor = hz => Math.tan(Math.PI * clamp(hz, 10, 0.45 * SR) / SR);
function voice(vals, h, seed, maxN) {
  const r = vals.map((x, i) => toReal(i, x));
  const dm = h.dm || 1; r[4] *= dm * (h.open ? 4 : 1); r[7] *= dm * (h.open ? 4 : 1);
  r[6] *= h.br || 1; r[10] *= h.br || 1;
  const vel = clamp(h.vel, 0, 1), harder = 0.15 * vel * vel;

// =====================================================================================
// Events
// =====================================================================================
function instAt(d) { const list = d.o === 'master' ? state.master.fx : state.slots[+d.i].fx; return { list, inst: list[+d.k] }; }

}
app.addEventListener('input', e => {

});
app.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.act === 'mono') { rowOf(d.w, +d.i).mono = t.checked; changed(false); }

  const t = e.target;
  if (t.id === 'state-d' && t.open) document.getElementById('state-pre').textContent = stateText();
  if (t.classList && t.classList.contains('grp')) state.openGroups = [...document.querySelectorAll('details.grp')].filter(x => x.open).map(x => x.dataset.g);
}, true);
app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); } });
app.addEventListener('click', e => {
  const grid = e.target.closest('#grid');
  if (grid) { gridClick(grid, e); return; }
  const b = e.target.closest('[data-act], button, [data-dl], [data-bpm]'); if (!b || b.disabled) return; const d = b.dataset, B = state.breaks;
  if (b.id === 'play') { ensureCtx(); if (cur) stop(); else { if (!render) doRender(); startSource(0); } drawTop(); return; }
